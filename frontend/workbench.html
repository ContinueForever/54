/* Keep replay navigation and the selected stage in one viewport. */
.shell.replay-mode{height:100dvh;min-height:0;overflow:hidden}
.replay-mode .main{height:100dvh;min-height:0;display:flex;flex-direction:column;padding-bottom:12px;overflow:hidden}
.replay-mode .topbar{height:54px;flex-shrink:0}
.replay-mode .hero{padding:14px 0 12px;flex-shrink:0}
.replay-mode .hero p{margin-top:3px}.replay-mode .hero-meta{margin-top:7px}
.replay-mode .provenance{margin-bottom:10px;flex-shrink:0;padding-top:7px;padding-bottom:7px}
.replay-mode #view{display:flex;flex-direction:column;flex:1;min-height:0}
.replay-mode .metrics{flex-shrink:0;margin-bottom:10px}.replay-mode .metric{padding:9px 14px}
.replay-mode .layout{flex:1;min-height:0;grid-template-rows:minmax(0,1fr);align-items:stretch}
.replay-mode .process{display:flex;flex-direction:column;min-height:0}
.replay-mode .process .head,.replay-mode .replay-controls,.replay-mode .process-note{flex-shrink:0}
.replay-mode .process-list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.replay-mode .stage{padding-top:5px;padding-bottom:5px}
.replay-mode .process .head{padding:12px 13px}.replay-mode .process .head p{display:none}
.replay-mode .process-list{padding:8px;gap:1px}.replay-mode .stage-text small{margin-top:1px}
.replay-mode .replay-controls{display:grid;grid-template-columns:1fr auto;padding:9px 10px;gap:7px}
.replay-mode .replay-controls #replay{grid-column:1;grid-row:1}.replay-mode .replay-controls #complete{grid-column:2;grid-row:1}
.replay-mode .replay-controls input{grid-column:1;grid-row:2;min-width:0;margin:0;align-self:center}.replay-mode .replay-controls select{grid-column:2;grid-row:2}
.replay-mode .process-note{display:none}
.replay-mode .process-note{padding:8px 13px}
.stage-workspace{min-width:0;min-height:0;display:flex;flex-direction:column}
.workspace-head{flex-shrink:0;border-bottom:1px solid var(--line);padding:16px 18px}
.workspace-head .eyebrow{font-size:9px;margin-bottom:5px}.workspace-head h2{font-size:17px}
.stage-content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:18px;scrollbar-gutter:stable}
.stage-content:focus-visible{outline:2px solid #97baf5;outline-offset:-3px}
.stage-content h3{font-size:13px;color:#46637f;margin-bottom:10px}.stage-content .section-gap{margin-top:20px}
.stage-content .asset-grid{grid-template-columns:1fr}.stage-content .file{margin-top:10px}
.stage-content .rule{align-items:flex-start}.stage-content .rule>div:nth-child(2){min-width:0;overflow-wrap:anywhere}
.stage-content .network{height:190px}.stage-content .facts{margin-top:16px}
.stage-content .intro{font-size:11px;line-height:1.9;color:#7b91a7;margin-bottom:14px}

recovery_capture=false。\n- 项目正式 incoming 下的 1 份 PCAP、1 份日志、1 份状态文件被加载。正式报告和追踪与演示目录副本逐字节一致。\n- PCAP 86 条记录与解码 JSON 对齐：56 条 IIH，正常探测 10 请求/10 应答，异常探测 10 请求/0 应答。\n- R01/R02 每个已采集窗口各 10 条 Hello，间隔 3 秒、Holding 27；R02 从 L2 变为 L1，R01 保持 L2。背景 R03/R04 每窗口各 4 条，间隔 9 秒。\n- 配置快照支持 R02 的进程和接口均改为 L1、R01 保持 L2；故障快照支持邻接 Down 与目标 IS-IS 路由缺失。抓包与日志、状态共同支持一个主根因及其后果。\n- 原始日志共 8 行，现已按时间排序；已识别 6 个事件。正常 0% 丢包识别为 probe_healthy，异常 100% 丢包识别为 packet_loss；全部原始行均进入保存的示例 prompt，包括配置提交和探测超时。\n- 4 条规则对应 3 个候选模式；同名层级故障跨 L2/L3 命中不算两个独立故障，邻接中断和业务探测退化是后果。\n- 知识检索实际为 local_csv，命中 5 节点；知识副本 82→87 节点。未重建索引，GraphRAG 一致性未检查。\n- 物理层未命中规则，与接口 UP、零错误计数、Hello 可见的有限证据一致；不能排除全部间歇性物理问题。\n- 当前没有修复后采集，恢复未验证。\n\n## 已修正的原审查问题\n\n### 邻接保持时间到期的精确归因缺少时间轴支持\n\nR02 的 T+40 s Down 已注明 local configuration changed；R01 在 T+55 s neighbor hold time expired。最后观察到的 R02 正常 L2 Hello 为 T+28.5 s，Holding 27 s，约 T+55.5 s 到期与秒级日志 T+55 相容。不再宣称双方同时到期。\n\n### 保存的示例模型输入缺少被输出引用的原始提交事件\n\nfeatures.json.log 保留全部 8 条 raw_lines；model-call.json.prompt 中逐条包含原始日志，含配置提交和探测超时。\n\n### 解读中的规则计数与实际运行不一致\n\n报告和示例均明确 4 条规则命中、3 个候选模式，1 个主根因及其后果。\n\n### 诊断报告输入清单遗漏设备状态文件\n\n报告输入清单已增加 state:1；prompt 中包含完整状态与配置快照。\n\n### 物理层 PASS 需要解释为未命中现有规则\n\n追踪的 L1 PASS 详情已改为“未命中本层规则”；模型示例保留有限快照不能排除间歇性物理问题的边界。\n\n### 聚合日志的两条事件不是按时间排列\n\n原始日志与 raw_lines 已按时间戳排序；配置提交与本地邻接失效先于 T+44 s 探测超时。\n\n### 日志提取把 0% 丢包也标记为 packet_loss\n\n0% packet loss 现在识别为 probe_healthy；100% packet loss 才标为 packet_loss，正常与异常探测已区分。\n\n## 工作台模板边界复核\n\n读取 demo/client-diagnosis/workbench.template.html，确认：\n\n- PASS 映射为“未命中”，并明确不代表全面健康证明；物理层有限快照的限制保留。\n- 当前 illustrative 模式直接说明“证据解读示例”“配置模型未调用”，耗时称为“示例装载耗时”；与真实独立 LLM 审查区分。\n- 回放明确只展开已有记录，不重新执行诊断；知识查询为本地 CSV，未重建 GraphRAG 索引。\n- 受控合成、处置未执行、恢复未验证的来源和范围说明保留。\n\n本次仅复核模板内容和来源逻辑，不替代浏览器交互、下载及视觉验收。\n\n## 非阻塞注意项\n\n### [INFO] 知识维护通过结构校验，但有非本案来源缺失与 GraphRAG 跳过项\n\n- 证据：knowledge-validation.json：2 个 RFC 5305 节点来源无法溯源（MAJOR）；6 对疑似同义节点（MINOR）；GraphRAG 一致性 SKIP。knowledge-query.json.mode=local_csv；preparation.json.index_rebuilt=false。\n- 风险：若把知识维护描述为“全部通过”或“本次进行了 GraphRAG 索引和在线检索”，将夸大实际执行范围。缺失 RFC 5305 节点没有用于本案最终主根因。\n- 建议：展示结构校验通过及剩余来源警告；明确本次使用本地 CSV 检索、未重建 GraphRAG 索引。后续补齐 RFC 5305 材料。\n\n## 结论\n\n当前证据及模板可以呈现“报障症状 → 报文/状态特征 → 知识与规则 → 候选原因比较 → 主根因归并 → 处置建议与待验证事项”。剩余知识来源注意项不涉及本案主结论，不阻塞本次演示。\n"},{"id":"device-events.log","path":"evidence/device-events.log","name":"device-events.log","size":565,"sha256":"80f38d368e0adab47601f56a0ccf773abfa49aa3595cca57a698432bcc0d3fe6","binary":false,"content":"Oct 14 14:30:02 R01 ISIS: Adjacency to R02 on Gig0/0/0 is UP\nOct 14 14:30:03 R02 ISIS: Adjacency to R01 on Gig0/0/0 is UP\nOct 14 14:30:28 R01 MONITOR: Ping to 10.20.2.1: 0% packet loss\nOct 14 14:30:40 R02 CONFIG: Configuration commit completed, revision 1042\nOct 14 14:30:40 R02 ISIS: Adjacency to R01 on Gig0/0/0 is Down, local configuration changed\nOct 14 14:30:44 R01 MONITOR: Probe to 10.20.2.1 timed out\nOct 14 14:30:55 R01 ISIS: Adjacency to R02 on Gig0/0/0 is Down, neighbor hold time expired\nOct 14 14:31:09 R01 MONITOR: Ping to 10.20.2.1: 100% packet loss\n"},{"id":"diagnosis-report.md","path":"evidence/diagnosis-report.md","name":"diagnosis-report.md","size":4239,"sha256":"81b822c1c648ed6da903213765de57cec9e294b93bbfae157b350eb48144b6cc","binary":false,"content":"# IS-IS 诊断报告 — run_20261014_173241_529785\n\n## 输入数据\n- pcap: 1\n- log: 1\n- state: 1\n\n## pcap 协议信号\n- link-observation.pcap:\n  - CIRCUIT_TYPE_CHANGE（R02 PDU类型: [18] -\u003e [17]）\n  - LINK_PROBE_DEGRADATION（fault 窗口 ICMP: req=10, reply=0）\n  - MIXED_HELLO_PDU_TYPES\n\n## 命中规则\n- [L2] L2-R001 adjacency_down: 检查链路状态、Hello定时器、认证配置\n- [L2] L2-R003 circuit_type_mismatch: 统一isis circuit-type配置\n- [L3] L3-R004 circuit_type_mismatch: 统一两端isis circuit-type配置\n- [L4] L4-R001 ping_unreachable: 检查路由表、IS-IS邻接状态、ACL配置\n\n## 规则归因汇总\n- 4 条规则命中，归并为 3 个候选模式。\n- adjacency_down: L2-R001\n- circuit_type_mismatch: L2-R003, L3-R004\n- ping_unreachable: L4-R001\n- 多层规则命中不等于多个独立根因；需区分根因与邻接、业务探测等后果。\n\n## 知识查询结果\n- [来源:RFC3358] adjacency_down Adjacency Down: IS-IS neighbor adjacency has transitioned to Down state\n- [来源:RFC3358] adjacency_up Adjacency Up: IS-IS neighbor adjacency has reached Up state\n- [来源:RFC3358] circuit_type_mismatch Circuit Type Mismatch: L1/L2 circuit level inconsistent\n- [来源:observational] netem_loss_delay Network Impairment: Packet loss or delay causing adjacency instability\n- [来源:rule:layer4_application.json] ping_unreachable ping_unreachable: 端到端ping不可达\n\n## LLM 诊断结论\n模型: demonstration/证据解读示例（未调用配置模型）\n\n# 大模型辅助诊断 · 证据解读示例\n\n本解读由 Codex 根据本次项目特征、规则、知识和状态快照编写，用于呈现模型环节的作用；未向项目配置的模型接口发送请求。\n\n## 最可能的原因\n\nR02 在配置变更后，进程 is-type 和接口 circuit-type 均由 level-2-only 变为 level-1；R01 保持 level-2-only。两端在这条链路上失去共同的 IS-IS 层级，导致原 L2 邻接不能继续维持。这是本例证据最充分的根因。\n\n## 证据关联\n\n1. 抓包正常窗口中，R01 与 R02 各发送 10 条 L2 Hello；异常窗口中，R01 仍有 10 条 L2 Hello，R02 改为 10 条 L1 Hello。Hello 间隔均为 3 秒，Holding 均为 27 秒。\n2. 设备状态快照与报文一致：R02 变更后的有效层级为 L1，R01 为 L2。日志在 T+40 秒记录 R02 配置提交及本地邻接失效，在 T+55 秒记录 R01 邻接因保持时间到期而中断。\n3. R01 到业务环回地址 10.20.2.1 的探测从 10 次请求、10 次应答变为 10 次请求、0 次应答；状态快照中对应 IS-IS 路由由存在变为缺失。\n4. L2-R003 与 L3-R004 指向同一 circuit_type_mismatch；L2-R001 记录邻接中断，L4-R001 记录业务探测退化。共四条规则命中、三个候选模式，证据支持一个主根因及其后果，不能将四条命中计作四个独立故障。\n\n## 候选原因比较\n\n- 层级配置变更：抓包、配置快照和提交事件三项一致，优先检查。\n- 物理断链：快照中接口仍为 UP、CRC 与输入错误为 0，且仍可观测双方 Hello，不支持本例由完整物理断链引起；有限快照不能排除所有间歇性物理问题。\n- 区域地址问题：两端快照与抓包区域地址相同；本例原目标为 L2 邻接，区域不同本身也不直接阻止 L2 邻接。\n- 认证问题：两端快照均未启用认证，观测 Hello 中未携带认证 TLV，本例没有认证失败证据。\n- MTU、ACL 或其他转发问题：两端 MTU 相同、Hello PDU 长度稳定；这些因素不是目前解释层级变化的首选原因。不能仅凭丢包和零错误计数排除所有转发问题。\n\n## 影响与处置\n\n已观测影响限定为 R01–R02 邻接和到 10.20.2.1 的业务探测。没有全网数据，不扩大到全网故障。\n\n核对 R02 最近配置变更、两端运行配置和预期网络设计。如果该链路应使用 L2，按变更流程将两端配置恢复到兼容的 L2 层级；同时检查进程 is-type 和接口 circuit-type，不能只改接口而忽略进程限制。\n\n调整后重新采集 Hello，确认出现共同层级，再检查双向邻接、路由和端到端探测。当前输入没有修复后采集，恢复尚未验证。\n"},{"id":"execution.json","path":"evidence/execution.json","name":"execution.json","size":2634,"sha256":"2cb761053d21663e3fef951ca429b07ea79ca8ba45a8cc09dd893ca50f4d608b","binary":false,"content":"[\n  {\n    \"id\": \"load\",\n    \"name\": \"加载数据\",\n    \"started_at\": \"2026-10-14T17:32:41.52984 ledge-input.txt","size":26422,"sha256":"bb5ea2de701d45dc22f5d50c263437009550b0c527c936638a05ab77246838af","binary":false,"content":"# RFC1195\n# RFC 1195 - 在 OSI IS-IS 中携带 IP 和 ISO 路由\n\nIS-IS 最初为 ISO CLNP 设计，RFC 1195 扩展了 IS-IS 以支持 IPv4/IPv6 路由，引入以下关键 TLV：\n\n- **TLV 128 (IP Internal Reachability)**：宣告直连 IPv4 前缀。\n- **TLV 129 (Protocols Supported)**：宣告支持的协议族（NLPID = 0xCC 表示 IPv4）。\n- **TLV 130 (IP External Reachability)**：宣告外部引入的 IPv4 路由。\n- **TLV 132 (IP Interface Address)**：宣告接口 IP 地址。\n\n## 诊断相关要点\n\n| 症状 | 可能原因 |\n|------|----------|\n| IP 路由不发布 | 缺少 Protocols Supported TLV 或 NLPID 不匹配 |\n| 外部路由不可达 | IP External Reachability TLV 缺失或 down-bit 置位 |\n| 邻居 UP 但无 IP 路由 | 接口未使能 IS-IS 或地址族未协商 |\n\n\n---\n# RFC3358\n# RFC 3358 - IS-IS 邻接关系与状态机\n\nIS-IS 邻接按如下状态机演进：\n\n```\nDown -\u003e Init -\u003e Up\n```\n\n## 关键状态\n\n- **Down**：未收到任何 IIH 或 Hold Timer 超时。\n- **Init**：收到 IIH，但邻居列表中未看到自己 System ID。\n- **Up**：双向通信确认，邻居列表中包含自己 System ID。\n\n## 影响邻接的常见故障\n\n| 故障类型 | 典型现象 |\n|----------|----------|\n| 区域不匹配 | 收到 IIH 但 Area Address TLV 不一致，邻接无法到达 Up |\n| 认证失败 | IIH 被丢弃，序列中看不到任何邻接状态变更 |\n| Hello 定时器不匹配 | 短期可能不影响邻接，长期导致保活抖动 |\n| Circuit Type 不匹配 | L1/L2 级别不一致，邻接状态停滞 |\n| 重复 System ID | LSP 冲突、多次邻接震荡 |\n| MTU 不匹配 | LSP 分片交互异常，邻接反复 Init |\n| 链路物理 down | 对端停止发送 IIH，本端 Hold Timer 超时后 Down |\n\n## 诊断规则\n\n- 若 fault 段 src_ids 减少且邻接日志出现 adjacency_down，判定为 NEIGHBOR_LOSS_AT_FAULT。\n- 若 fault 段持续收到 IIH 但邻接不 Up，检查 Area、Auth、Circuit Type、MTU。\n- 若出现 duplicate_system_id 标志且多个节点共享同一 System ID，判定为 DUPLICATE_SYSTEM_ID。\n\n\n---\n# RFC5301\n# RFC 5301 - IS-IS 动态主机名\n\n动态主机名映射 System ID 到可读名称，通过 **TLV 137 (Dynamic Hostname)** 携带。\n\n## 诊断价值\n\n- 通过 System ID 反查主机名，便于定位故障节点。\n- 若日志或 pcap 中出现 System ID 冲突，可结合主机名快速定位网元。\n\n## 表格\n\n| System ID | Hostname | Role |\n|-----------|----------|------|\n| 0000.0000.0001 | R01 | 星型中心 |\n| 0000.0000.0002 | R02 | 焦点节点 |\n| 0000.0000.0003 | R03 | 背景节点 |\n| 0000.0000.0004 | R04 | 背景节点 |\n| 0000.0000.0005 | R05 | 背景节点 |\n\n\n---\n## Entity: L1 CSNP (PDU_L1_CSNP)\nType: protocol\nDescription: Complete Sequence Number PDU used for LSDB synchronization on L1 broadcast segments\nSource: RFC 1195\n\n---\n## Entity: L1 LAN IIH (PDU_L1_LAN_IIH)\nType: protocol\nDescription: Level-1 LAN Hello PDU used on L1-only broadcast segments\nSource: RFC 1195\n\n---\n## Entity: L1 LSP (PDU_L1_LSP)\nType: protocol\nDescription: Level-1 Link State PDU carrying area topology information\nSource: RFC 1195\n\n---\n## Entity: L2 CSNP (PDU_L2_CSNP)\nType: protocol\nDescription: Complete Sequence Number PDU used for LSDB synchronization on L2 broadcast segments\nSource: RFC 1195\n\n---\n## Entity: L2 LAN IIH (PDU_L2_LAN_IIH)\nType: protocol\nDescription: Level-2 LAN Hello PDU used to discover and maintain IS-IS neighbors on broadcast segments\nSource: RFC 1195\n\n---\n## Entity: L2 LSP (PDU_L2_LSP)\nType: protocol\nDescription: Level-2 Link State PDU carrying topology and reachability information\nSource: RFC 1195\n\n---\n## Entity: P2P IIH (PDU_P2P_IIH)\nType: protocol\nDescription: Point-to-point Hello PDU used on point-to-point links\nSource: RFC 1195\n\n---\n## Entity: Router R01 (R01)\nType: device\nDescription: Central star router in the simulated topology\nSource: topology\n\n---\n## Entity: Router R02 (R02)\nType: device\nDescription: Fault-peer router on the focal link\nSource: topology\n\n---\n## Entity: Area Address TLV (TLV_AREA_ADDR)\nType: tlv\nDescription: TLV 1 lists area addresses supported by the originating IS\nSource: RFC 1195\n\n---\n## Entity: Authentication TLV (TLV_AUTH)\nType: tlv\nDescription: TLV 10 carries authentication information used to verify IS-IS PDUs\nSource: RFC 1195\n\n---\n## Entity: Extended IP Reachability TLV (TLV_EXT_IP_REACH)\nType: tlv\nDescription: TLV 135 describes IP prefixes with extended metrics\nSource: RFC 5305\n\n---\n## Entity: Extended IS Reachability TLV (TLV_EXT_IS_REACH)\nType: tlv\nDescription: TLV 22 describes IS neighbors with extended metrics\nSource: RFC 5305\n\n---\n## Entity: Dynamic Hostname TLV (TLV_HOSTNAME)\nType: tlv\nDescription: TLV 137 carries human-readable hostname of the router\nSource: RFC 5301\n\n---\n## Entity: IP Interface Address TLV (TLV_IP_ADDR)\nType: tlv\nDescription: TLV 132 lists IPv4 addresses of the originating interface\nSource: RFC 1195\n\n---\n## Entity: Padding TLV (TLV_PADDING)\nType: tlv\nDescription: TLV 8 is used to pad PDUs to desired size for MTU consistency\nSource: RFC 1195\n\n---\n## Entity: Protocols Supported TLV (TLV_PROTOS_SUPPORTED)\nType: tlv\nDescription: TLV 129 lists NLPIDs of network layer protocols supported by the IS\nSource: RFC 1195\n\n---\n## Entity: Adjacency (adjacency)\nType: symptom\nDescription: 规则 adjacency_down 的指标：Adjacency\nSource: rule:layer2_link.json\n\n---\n## Entity: Adjacency Down (adjacency_down)\nType: state\nDescription: IS-IS neighbor adjacency has transitioned to Down state\nSource: RFC3358\nRelationship: adjacency_down --causes--\u003e neighbor_loss. Neighbor adjacency Down leads to neighbor loss symptom\nRelationship: adjacency_down --indicates--\u003e adjacency. adjacency_down indicates Adjacency\nRelationship: adjacency_down --indicates--\u003e down. adjacency_down indicates Down\n\n---\n## Entity: Adjacency Up (adjacency_up)\nType: state\nDescription: IS-IS neighbor adjacency has reached Up state\nSource: RFC3358\n\n---\n## Entity: Area Mismatch (area_mismatch)\nType: fault\nDescription: Area Address TLV does not match between neighbors\nSource: RFC3358\nRelationship: area_mismatch --prevents--\u003e adjacency_up. Area mismatch prevents adjacency from reaching Up\nRelationship: area_mismatch --causes--\u003e adjacency_down. Area Mismatch may cause adjacency Down\nRelationship: area_mismatch --indicates--\u003e 两端区域地址不同. area_mismatch indicates 两端区域地址不同\nRelationship: area_mismatch --indicates--\u003e l1/l2邻接建立失败. area_mismatch indicates L1/L2邻接建立失败\nRelationship: area_mismatch --indicates--\u003e 区域间路由不可达. area_mismatch indicates 区域间路由不可达\n\n---\n## Entity: auth_fail (auth_fail)\nType: symptom\nDescription: 规则 auth_failure 的指标：auth_fail\nSource: rule:layer2_link.json\n\n---\n## Entity: auth_failure (auth_failure)\nType: rule\nDescription: IS-IS认证失败\nSource: rule:layer2_link.json\nRelationship: auth_failure --indicates--\u003e auth_fail. auth_failure indicates auth_fail\nRelationship: auth_failure --indicates--\u003e authentication_failed. auth_failure indicates Authentication failed\n\n---\n## Entity: Authentication Mismatch (auth_mismatch)\nType: fault\nDescription: Authentication TLV missing or checksum invalid\nSource: RFC3358\nRelationship: auth_mismatch --prevents--\u003e adjacency_up. Authentication failure prevents adjacency Up\nRelationship: auth_mismatch --causes--\u003e adjacency_down. Authentication Mismatch may cause adjacency Down\n\n---\n## Entity: Authentication failed (authentication_failed)\nType: symptom\nDescription: 规则 auth_failure 的指标：Authentication failed\nSource: rule:layer2_link.json\n\n---\n## Entity: Baseline (baseline)\nType: fault\nDescription: baseline 对照场景：before / fault / after 均为正常 IIH，标准化异常应为 0。\nSource: scenario\nRelationship: baseline --causes--\u003e adjacency_down. Baseline may cause adjacency Down\n\n---\n## Entity: Circuit Type Mismatch (circuit_type_mismatch)\nType: fault\nDescription: L1/L2 circuit level inconsistent\nSource: RFC3358\nRelationship: circuit_type_mismatch --prevents--\u003e adjacency_up. Circuit level mismatch prevents adjacency Up\nRelationship: circuit_type_mismatch --causes--\u003e adjacency_down. Circuit Type Mismatch may cause adjacency Down\nRelationship: circuit_type_mismatch --indicates--\u003e 一端为l1_only，另一端为l2_only. circuit_type_mismatch indicates 一端为L1-only，另一端为L2-only\nRelationship: circuit_type_mismatch --indicates--\u003e 只能建立单边邻接. circuit_type_mismatch indicates 只能建立单边邻接\nRelationship: circuit_type_mismatch --indicates--\u003e level不匹配导致路由信息丢失. circuit_type_mismatch indicates Level不匹配导致路由信息丢失\n\n---\n## Entity: combo-auth-area (combo_auth_area)\nType: composite d_at\": \"2026-10-14T17:32:41.529841+08:00\",\n  \"completed_at\": \"2026-10-14T17:32:41.535698+08:00\",\n  \"orchestrator\": {\n    \"skill\": \"workspace-orchestrator\",\n    \"executor\": \"Codex agent\",\n    \"actions\": [\n      \"检查输入来源与完整性\",\n      \"在副本准备并校验知识\",\n      \"调用项目诊断引擎\",\n      \"检查规则归因与模型证据\",\n      \"独立审查并交付工作台\"\n    ],\n    \"entrypoint\": \"demo/client-diagnosis/run_case.py\",\n    \"note\": \"技能由本次执行代理按 SKILL.md 应用；不是声称引擎独立调用了 skill API。\"\n  },\n  \"stage_skills\": {\n    \"load\": \"isis-analysis\",\n    \"feature\": \"isis-analysis\",\n    \"knowledge\": \"knowledge-bridge\",\n    \"L1\": \"isis-analysis\",\n    \"L2\": \"isis-analysis\",\n    \"L3\": \"isis-analysis\",\n    \"L4\": \"isis-analysis\",\n    \"llm\": \"isis-analysis\",\n    \"report\": \"isis-analysis\"\n  },\n  \"tracer\": {\n    \"skill\": \"flow-tracer\",\n    \"entrypoint\": \"agent_analysis.tracer.Tracer\",\n    \"trace_file\": \"evidence/analysis-trace.json\"\n  },\n  \"knowledge_preparation\": \"evidence/preparation.json\"\n}"},{"id":"skill-definitions/flow-tracer.md","path":"evidence/skill-definitions/flow-tracer.md","name":"flow-tracer.md","size":1700,"sha256":"dd48bdcd51cea6413d196bce3a94696aee36848e2d4393d7a2729dc6fb3c3568","binary":false,"content":"---\nname: flow-tracer\ndescription: \"流程追踪技能 — 记录分析执行过程，生成时序流程图\"\nversion: 1.0.0\nauthor: agent-analysis team\n---\n\n# flow-tracer\n\n## 触发条件\n\n- 分析流程开始/结束\n- 用户要求\"查看流程\"、\"生成时序图\"、\"追踪记录\"\n- 诊断完成后自动生成\n\n## 执行步骤\n\n1. **监听事件**: 在分析引擎各关键步骤插入追踪点\n2. **记录状态**: 记录时间、层级、动作、结果、耗时\n3. **生成追踪**: 将追踪记录写入 `data/traces/trace_\u003ctimestamp\u003e.json`\n4. **渲染图表**: 将追踪记录转为 Mermaid 序列图 HTML\n5. **输出文件**: 保存到 `output/sequence_diagrams/`\n\n## 追踪记录格式\n\n```json\n{\n  \"trace_id\": \"run_20250602_143052\",\n  \"steps\": [\n    {\"seq\": 1, \"timestamp\": \"14:30:53\", \"layer\": \"L1\", \"action\": \"物理层检查\", \"status\": \"PASS\"},\n    {\"seq\": 2, \"timestamp\": \"14:30:55\", \"layer\": \"L2\", \"action\": \"链路层检查\", \"status\": \"PASS\"},\n    {\"seq\": 3, \"timestamp\": \"14:30:58\", \"layer\": \"L3\", \"action\": \"IS-IS检查\", \"status\": \"FAIL\", \"anomaly_id\": \"L3-R001\"}\n  ]\n}\n```\n\n## 时序图输出\n\n生成 Mermaid 格式的序列图，可在浏览器中查看：\n\n```bash\n# 打开生成的 HTML 文件\nfirefox output/sequence_diagrams/run_20250602_143052.html\n```\n\n## 注意事项\n\n- 追踪记录是诊断过程的关键证据，保留30天\n- 时序图帮助开发人员快速定位问题出现的步骤\n- 每个分析任务生成独立的追踪记录，不互相覆盖\n\n## 示例\n\n```\n用户：显示上次分析的流程图\nHermes：\n  1. 读取最新的 trace 文件\n  2. 生成 Mermaid 序列图\n  3. 输出 HTML 文件路径\n  4. 用户可在浏览器中查看完整流程\n```\n"},{"id":"skill-definitions/isis-analysis.md","path":"evidence/skill-definitions/isis-analysis.md","name":"isis-analysis.md","size":1924,"sha256":"c481ca5470c3e92f32d7d68e2e6eba9b9377da33a91f8109025e7e2375055f09","binary":false,"content":"---\nname: isis-analysis\ndescription: \"IS-IS 网络数据分析主技能 — 分层诊断、规则匹配、LLM辅助\"\nversion: 1.0.0\nauthor: agent-analysis team\n---\n\n# isis-analysis\n\n## 触发条件\n\n- 用户提到\"分析\"、\"诊断\"、\"检查\"、\"排查\"等关键词\n- 用户提供了 pcap、log、或网络状态数据\n- 用户询问某个节点或链路的状态\n\n## 执行步骤\n\n1. **确认数据**: 检查 `data/incoming/` 是否有待分析的数据，或询问用户提供\n2. **加载配置**: 读取 `config/analysis_pipeline/default_pipeline.json` 和 `config/diagnosis_rules/`\n3. **分层检查**: 按流水线配置顺序执行各层检查（L1物理层 → L2链路层 → L3路由层 → L4应用层）\n4. **规则匹配**: 每层调用对应的 JSON 规则文件进行匹配\n5. **异常处理**: \n   - 规则命中 → 直接输出诊断结论\n   - 规则未覆盖 → 调用甲方本地 vLLM 辅助诊断\n6. **生成追踪**: 记录每个步骤的执行结果到 `data/traces/`\n7. **输出报告**: 生成 Markdown 报告和 Mermaid 时序流程图到 `output/`\n\n## 注意事项\n\n- 分析过程中**只读**甲方数据，不修改原始文件\n- 优先使用确定性规则，LLM仅作为补充\n- 每次分析生成唯一的 trace_id，便于后续追溯\n- 磁盘使用率超过95%时停止写入并告警\n\n## 示例\n\n```\n用户：请分析刚才收到的 s1-s2 链路数据\nHermes：\n  1. 发现 data/incoming/20250602/143052/ 下的数据\n  2. 执行分层检查...\n  3. L1: 接口状态正常 ✅\n  4. L2: 邻居发现异常 ❌（Hello报文丢失）\n  5. L3: 规则匹配 — L2链路层故障\n  6. 生成诊断报告和时序流程图\n  7. 输出：output/reports/report_20250602_143052.md\n```\n\n## 参考文档\n\n- `references/analysis_framework.md` — 分析框架详细说明\n- `references/isis_rfc_quickref.md` — IS-IS RFC 速查\n- `references/pcap_log_patterns.md` — 常见报文和日志模式\n"},{"id":"skill-definitions/kg-validator.md","path":"evidence/skill-definitions/kg-validator.md","name":"kg-validator.md","size":4935,"sha256":"440ac144902d46ba3c9acded44f64671a86b6a7fd360e7ebfe7743df9279fbd7","binary":false,"content":"---\nname: kg-validator\ndescription: \"54所 IS-IS 知识图谱提取准确性验证技能：校验 knowledge/tables CSV、knowledge_graph.json 与 GraphRAG 索引的一致性、引用完整性、来源真实性与提取准确性，输出分级验证报告\"\nversion: 1.0.0\nauthor: agent-analysis team\n---\n\n# kg-validator\n\n## 角色定位\n\n本 skill 是知识管线的**质量门禁**，负责验证\"从素材（RFC 摘要 / 诊断规则 /\n仿真场景 / 学习快照）提取到知识图谱\"这一过程的**准确性**，回答三个问题：\n\n1. **结构对不对**：CSV / JSON 是否符合 schema，引用是否完整（悬空边、重复节点）\n2. **内容真不真**：每个节点的 source 标注是否真实存在，描述是否与来源素材一致\n3. **同步没同步**：tables → knowledge_graph.json → GraphRAG 索引 三级是否一致\n\n本 skill **只验证、不修改**。发现的问题输出为分级报告，由人工或\n`knowledge-builder` / `material-to-csv` 修复后重新验证。\n\n与项目其他 skill 的关系：\n\n```\nmaterial-to-csv ──\u003e knowledge/tables ──\u003e knowledge-builder(build+index) ──\u003e GraphRAG\n                            │                                              │\n                            └──────────── kg-validator 全程验证 ◄──────────┘\nworkspace-orchestrator 的诊断质量依赖本 skill 保证的知识准确性\n```\n\n## 触发条件\n\n- 用户要求\"验证知识图谱\"、\"检查知识库准确性\"、\"知识图谱对不对\"\n- `material-to-csv` 合并新素材后（自动执行本地校验）\n- `knowledge-builder` 重建图谱后、构建索引前（自动执行本地校验）\n- 完整工作流运行分析前（自动执行，含服务检查）\n- GraphRAG 查询结果出现张冠李戴、引用不存在实体等疑似知识错误时\n- 交付甲方前的例行质量检查\n\n## 执行原则\n\n1. **只读验证**：绝不修改 knowledge/ 与 graphrag/ 下任何文件；报告写入\n   `knowledge/learnings/validation/`（该目录专为验证报告保留）\n2. **证据驱动**：每条 FAIL/WARN 必须给出文件位置与具体内容，不允许\"可能有问题\"\n3. **分级处置**：CRITICAL（结构损坏/悬空引用，会直接导致诊断或索引出错）/\n   MAJOR（来源不实、描述与来源矛盾）/ MINOR（命名不规范、冗余）/\n   INFO（改进建议）\n4. **Python 环境一致性**：使用 `python3`，跨项目模块需 PYTHONPATH 包含\n   `agent-analysis/src:isis-simulator/src:graphrag/src:knowledge`\n5. **GraphRAG 检查可降级**：服务未启动时相关检查标记 SKIP 而非 FAIL\n\n## 验证项总览\n\n详见 `references/validation-checklist.md`。六大类：\n\n| 类别 | 内容 | 典型问题 |\n|------|------|---------|\n| A. Schema | CSV 列名/必填列/编码/JSON 合法性 | 列缺失、BOM、非法 JSON |\n| B. 引用完整性 | 边两端节点存在、combines 指向 fault 节点 | 悬空边、combines 指向不存在子故障 |\n| C. 去重 | node_id 重复、边重复、名称近似重复 | 同义节点（auth_mismatch vs auth_failure） |\n| D. 来源真实性 | source 字段可溯源（RFC 文件/规则 JSON/scenario 注册表） | source 标注的文件不存在 |\n| E. 三级一致性 | CSV ↔ knowledge_graph.json ↔ GraphRAG /health 计数 | 索引陈旧（改了表没重建） |\n| F. 提取准确性抽检 | 节点描述与来源素材内容比对 | 描述张冠李戴、TLV 编号错误 |\n\n## 使用方法\n\n```bash\ncd /home/hermes/workspace\n\n# 全量验证（六大类）\npython3 skills/kg-validator/run.py\n\n# 只跑某几类\npython3 skills/kg-validator/run.py --checks A,B,E\n\n# 含 GraphRAG 服务一致性（服务需在运行）\npython3 skills/kg-validator/run.py --graphrag-url http://localhost:9200\n\n# 输出 JSON 供程序消费\npython3 skills/kg-validator/run.py --json\n```\n\n退出码：0 = 无 CRITICAL；1 = 存在 CRITICAL（适合接入 CI / cron 门禁）。\n\n## 输出\n\n- 终端：分级摘要 + 每条问题的证据\n- 文件：`knowledge/learnings/validation/kg_validation_\u003cts\u003e_\u003c微秒\u003e.md`\n  （完整报告，含各类逐项结果与修复建议）\n\n## 与其他 skill 的衔接\n\n- 发现 CRITICAL（如悬空边）→ 提示用 `material-to-csv` 或手工修表后\n  重跑 `knowledge-builder` 的 build 阶段\n- 发现 E 类不一致（索引陈旧）→ 提示重跑 `knowledge-builder` 的 index 阶段\n- 验证通过是把新知识交付给 `workspace-orchestrator` 诊断使用的前提\n\n## 注意事项\n\n- F 类抽检默认抽 10 个节点（`--sample N` 调整），全量比对用 `--sample 0`\n- 描述比对是**关键词级**核对（来源文本中是否包含描述的核心术语），\n  不做语义级判断；语义存疑的标 INFO 交由人工或 LLM 复核\n- node_attributes.csv 的 TLV code 会与 `isis_simulator/isis_pdu.py`\n  中实际使用的 TLV 常量交叉核对（如存在该模块）\n"},{"id":"skill-definitions/knowledge-bridge.md","path":"evidence/skill-definitions/knowledge-bridge.md","name":"knowledge-bridge.md","size":1469,"sha256":"2c352c3d12f41d667fbee91f358811e8b96da229e7005f14e223bbc427ba93d3","binary":false,"content":"---\nname: knowledge-bridge\ndescription: \"知识桥接技能 — 将甲方提供的表格形态知识图谱加载为可用知识\"\nversion: 1.0.0\nauthor: agent-analysis team\n---\n\n# knowledge-bridge\n\n## 触发条件\n\n- 用户提到\"知识库\"、\"知识图谱\"、\"规则查询\"\n- 诊断过程中需要查询与某异常相关的知识\n- 甲方更新了知识表格\n\n## 执行步骤\n\n1. **检查表格**: 确认 `config/knowledge_tables/` 下是否有有效表格\n2. **加载解析**: 调用 `analysis/knowledge_adapter.py` 加载 CSV 表格\n3. **构建图谱**: 在内存中构建节点-边关系图\n4. **提供查询**: 响应知识查询请求，返回相关知识\n\n## 表格格式约定\n\n甲方提供的知识图谱表格需符合以下格式：\n\n### nodes.csv\n```csv\nnode_id,node_type,name,description,layer\nN001,anomaly,lsp_seq_wrap,LSP序列号异常环绕,L3\nN002,symptom,neighbor_flap,邻居关系频繁震荡,L2\n```\n\n### edges.csv\n```csv\nsource_id,target_id,relation,strength\nN001,N002,causes,0.8\nN002,N003,indicates,0.9\n```\n\n## 注意事项\n\n- 表格更新后无需重启，下次查询自动加载最新版本\n- 当前仅支持 CSV 格式，未来可能扩展为 GraphRAG\n- 知识查询结果供诊断引擎参考，不作为唯一依据\n\n## 示例\n\n```\n用户：查询与 LSP 序列号异常相关的知识\nHermes：\n  1. 加载 knowledge_tables/\n  2. 查询节点 N001 (lsp_seq_wrap)\n  3. 返回：相关症状、可能原因、影响范围、修复建议\n```\n"},{"id":"skill-definitions/knowledge-builder.md","path":"evidence/skill-definitions/knowledge-builder.md","name":"knowledge-builder.md","size":8241,"sha256":"6e3b361285011505501ad5e6c5d3b06885a4635f7e39b249af188d0a02a27a98","binary":false,"content":"---\nname: knowledge-builder\ndescription: \"54所 IS-IS 知识图谱构建与持续学习技能：从仿真/真实数据生成知识图谱，构建 GraphRAG 索引，发现未知故障并补充知识\"\nversion: 1.0.0\nauthor: agent-analysis team\n---\n\n# knowledge-builder\n\n## 角色定位\n\n本 skill 负责**知识图谱的生命周期管理**，包括：\n\n1. 生成/收集 IS-IS pcap、log 数据（仿真或真实）\n2. 结合已有 RFC 摘要和诊断规则，构建 CSV 表格知识图谱\n3. 生成 GraphRAG 输入文本\n4. 构建 GraphRAG 索引\n5. 通过 material-to-csv 导入文档/日志素材，通过 kg-validator 自动校验图谱\n6. 长期运行后，收集未知故障样本，通过聚类/规则比对发现新故障模式，\n   经人工确认后补充到知识图谱中\n\n本 skill **不负责**具体故障诊断。\n诊断分析请使用 `workspace-orchestrator` skill。\n\n## 触发条件\n\n- 用户要求\"构建知识图谱\"、\"更新知识库\"、\"生成 GraphRAG 索引\"\n- 用户要求\"从真实数据补充知识\"、\"发现新故障模式\"\n- 用户运行\"知识库初始化\"、\"知识库增量更新\"\n- 定时任务需要定期更新知识图谱（例如每日/每周）\n\n## 执行原则\n\n1. **规则优先**：已有 RFC 摘要和 JSON 诊断规则是知识的主要来源\n2. **仿真补充**：从 `isis-simulator` 场景中提取故障定义作为补充\n3. **真实数据驱动**：长期运行积累的真实 pcap/log 是发现未知故障的主要来源\n4. **人工确认**：自动发现的新故障模式必须以\"候选\"形式保存，经确认后才合并入主图谱\n5. **可回滚**：每次更新保留 `knowledge/tables/` 和 `knowledge/learnings/` 的历史快照\n6. **Python 环境一致性**：本工作区使用 `python3`（`/usr/bin/python3`），且 `agent-analysis/src`、`isis-simulator/src`、`graphrag/src`、`knowledge` 等模块未安装到系统 site-packages，必须通过 `PYTHONPATH` 加载。运行任何跨项目命令前，先确认 `PYTHONPATH` 已包含上述路径；否则会出现 `No module named isis_simulator` 等导入错误。优先使用 `scripts_lib/runner.py` 中的 `pythonpath_env()` 和 `run()` 来统一执行环境。\n\n## 环境要求\n\n- 工作目录：`/home/hermes/workspace`\n- `scripts_lib/runner.py` 提供共享工具函数\n- `knowledge/tables/` 存放当前生效的 CSV 知识图谱\n- `knowledge/learnings/` 存放未知故障样本和候选节点\n\n## 工作流步骤\n\n### 流程 A：从基础规则初始化知识图谱\n\n1. **读取基础规则**：\n   - `knowledge/rfc/` 中的 RFC 摘要\n   - `agent-analysis/config/diagnosis_rules/` 中的 JSON 规则\n   - `agent-analysis/config/knowledge_tables/` 中的初始 CSV（若存在）\n2. **提取仿真场景**：从 `isis-simulator/src/isis_simulator/scenarios/*.py` 提取故障定义\n3. **合并节点和边**：去重合并到 `knowledge/tables/nodes.csv` 和 `edges.csv`\n4. **生成 JSON 中间文件**：`knowledge/knowledge_graph.json`\n5. **生成 GraphRAG 输入文本**：`graphrag/input/knowledge_graph.txt`\n6. **构建 GraphRAG 索引**：`python -m graphrag_server.indexer`\n7. **启动 GraphRAG 服务**（可选）：供后续 `workspace-orchestrator` 查询使用\n\n### 流程 B：从长期运行数据中发现新故障（持续学习）\n\n1. **收集学习样本**：\n   - 从 `agent-analysis/data/traces/` 读取历史 trace\n   - 从 `agent-analysis/output/reports/` 读取历史报告\n   - 从指定的历史数据目录读取 pcap/log\n2. **识别未命中规则的样本**：\n   - 提取 event_types\n   - 与 `config/diagnosis_rules/` 中所有规则的 indicators 比对\n   - 未匹配的记录为\"未知事件\"\n3. **聚类未知事件**：\n   - 按 event_type 聚类\n   - 按出现频率、影响节点、时间窗口进一步分组\n4. **生成候选节点/边**：\n   - 写入 `knowledge/learnings/candidates/` 目录\n   - 每个候选包含：事件名称、描述、出现次数、样例 trace_id、建议关系\n5. **人工确认（推荐）**：\n   - 由开发人员审查候选文件\n   - 确认后调用 `knowledge-builder apply-candidates` 合并到主图谱\n6. **重新构建 GraphRAG 索引**\n\n### 流程 C：增量更新（已有新场景/新规则）\n\n1. 重新运行 `knowledge.scripts.build`\n2. 重新运行 `knowledge.scripts.build_graphrag_input`\n3. 运行 `python3 skills/knowledge-builder/run.py graphrag-index`（先校验并刷新输入，再构建索引）\n4. 启动/重启 GraphRAG 服务\n\n## 与 Hermes 对话示例\n\n### 示例 1：初始化知识图谱\n\n```\n用户：初始化知识图谱\nHermes：\n  1. 读取 RFC 摘要和诊断规则\n  2. 提取 10 个 isis-simulator 故障场景\n  3. 合并生成 25 个节点、35 条边\n  4. 写入 knowledge/tables/nodes.csv 和 edges.csv\n  5. 生成 GraphRAG 输入文本（约 8000 字符）\n  6. 构建 GraphRAG 索引...\n  7. 索引构建完成，启动 GraphRAG 服务在 localhost:9200\n```\n\n### 示例 2：从真实数据发现未知故障\n\n```\n用户：分析最近一个月的 trace，看看有没有新故障模式\nHermes：\n  1. 读取 agent-analysis/data/traces/ 下 120 个 trace\n  2. 提取 event_types 并比对诊断规则\n  3. 发现 3 类未命中规则的事件：\n     - isis_lsp_checksum_error（出现 8 次）\n     - isis_overload_bit_set（出现 5 次）\n     - isis_mtu_propagation_fail（出现 2 次）\n  4. 生成候选文件：\n     - knowledge/learnings/candidates/20260706_143052.json\n  5. 请人工确认后，调用 knowledge-builder apply-candidates\n```\n\n### 示例 3：合并候选故障到主图谱\n\n```\n用户：确认合并昨天发现的候选故障\nHermes：\n  1. 读取 knowledge/learnings/candidates/20260706_143052.json\n  2. 将确认的候选节点/边追加到 nodes.csv/edges.csv\n  3. 重新生成 GraphRAG 输入并构建索引\n  4. 候选文件已标记为 applied\n```\n\n## 常用命令速查\n\n运行以下入口会自动配置项目环境，无需额外设置 PYTHONPATH：\n\n```bash\npython3 skills/knowledge-builder/run.py build\npython3 skills/knowledge-builder/run.py build --no-index\npython3 skills/knowledge-builder/run.py build-csv\npython3 skills/knowledge-builder/run.py graphrag-index\npython3 skills/knowledge-builder/run.py serve --port 9200\npython3 skills/knowledge-builder/run.py discover --days 30\npython3 skills/knowledge-builder/run.py candidates\npython3 skills/knowledge-builder/run.py apply-candidates --candidate 20260706_143052\n\n# 提取素材、审阅候选，再显式合并\npython3 skills/knowledge-builder/run.py extract /path/to/material.csv --source table:material.csv --batch import_001\npython3 skills/knowledge-builder/run.py diff knowledge/incoming/import_001\npython3 skills/knowledge-builder/run.py merge knowledge/incoming/import_001\n# --index 可在合并后继续更新检索索引\npython3 skills/knowledge-builder/run.py merge knowledge/incoming/import_001 --index\npython3 skills/knowledge-builder/run.py validate --graphrag-url \"\"\n```\n\n素材提取/合并实现位于 `skills/material-to-csv/run.py`，校验实现位于\n`skills/kg-validator/run.py`。统一构建实现位于 `knowledge/scripts/build.py`。\n构建前检查结构并备份，构建后自动校验，索引前再次校验。CRITICAL 停止后续步骤；\n其他等级写入验证报告。`merge` 默认只更新本地图谱和检索输入，`--index` 更新索引并尝试重启已运行的项目 systemd 服务。\n\n## 输出产物\n\n- `knowledge/tables/nodes.csv` — 当前知识节点\n- `knowledge/tables/edges.csv` — 当前知识关系\n- `knowledge/knowledge_graph.json` — 中间 JSON\n- `knowledge/learnings/` — 学习样本和候选节点\n- `graphrag/input/knowledge_graph.txt` — GraphRAG 输入文本\n- `graphrag/output/` — GraphRAG 索引产物\n\n## 参考文档\n\n- `references/continuous-learning-pipeline.md` — 从长期运行数据中发现未知故障并补充知识图谱的完整流程和候选文件格式\n\n- 构建 GraphRAG 索引需要 LLM API 配置（`graphrag/.env` 和 `config/settings.yaml`），离线环境请使用本地 vLLM\n- 大规模索引前建议先用 `--dry-run` 验证配置\n- 真实数据中的未知事件可能包含噪声，候选节点需人工确认后再合并\n- 定期备份 `knowledge/tables/` 目录，避免误操作导致知识丢失\n"},{"id":"skill-definitions/material-to-csv.md","path":"evidence/skill-definitions/material-to-csv.md","name":"material-to-csv.md","size":6496,"sha256":"edca0836e493df486d4ef55d6379dc631bcfc4f55641f4f2f8035311a92fff3d","binary":false,"content":"---\nname: material-to-csv\ndescription: \"54所 IS-IS 素材转 CSV 知识表格技能：将 RFC 文本、日志、厂商文档等素材转换为项目标准 CSV 知识表格（nodes/edges/node_attributes），自动去重、冲突检测，输出候选表格供 knowledge-builder 合并\"\nversion: 1.0.0\nauthor: agent-analysis team\n---\n\n# material-to-csv\n\n## 角色定位\n\n本 skill 是知识管线的**入料口**，负责把各种原始素材转换成项目标准的三张\nCSV 知识表格，与现有知识管线无缝衔接：\n\n```\n素材（RFC文本/日志/文档/甲方表格）\n   │  material-to-csv（本 skill）\n   ▼\n候选 CSV（knowledge/incoming/）── 去重/冲突检测 ──► 合并进 knowledge/tables/\n                                                          │  knowledge-builder\n                                                          ▼\n                                              knowledge_graph.json → GraphRAG 索引\n                                                          │  kg-validator\n                                                          ▼\n                                                     准确性验证\n```\n\n合并后自动调用项目构建入口重建本地图谱，并委托 kg-validator 校验；\n`merge --index` 可继续委托共享工具构建 GraphRAG 索引。不做故障诊断。\n\n## 触发条件\n\n- 用户要求\"把这份 RFC/文档/日志转成知识表格\"、\"提取成 CSV\"\n- 甲方提供新的知识素材（RFC 全文、厂商故障手册、历史工单日志）\n- knowledge-builder discover 发现候选知识后需要格式化为表格\n- 批量导入甲方 `config/knowledge_tables/` 提供的新 CSV 前的格式规整\n\n## 执行原则\n\n1. **Schema 严格对齐**：输出必须符合现有三张表的列定义（见下），\n   这是与 knowledge-builder / kg-validator 衔接的契约\n2. **候选制，不直改**：默认输出到 `knowledge/incoming/` 作为候选，\n   经人工确认后用 `merge` 子命令才合并进 `knowledge/tables/`\n3. **去重优先**：与现有 nodes.csv 比对，已有节点只补充不覆盖；\n   冲突（同 ID 不同描述）单列报告交人工裁决\n4. **来源必填**：每个提取的节点必须标注 source（RFC 编号 / 文件名 / 工单号），\n   否则 kg-validator D 类检查会失败\n5. **可重现**：同一素材重复运行产生相同候选输出（幂等），合并有快照可回滚\n6. **Python 环境一致性**：使用 `python3`，跨项目模块需 PYTHONPATH 包含\n   `agent-analysis/src:isis-simulator/src:graphrag/src:knowledge`\n\n## CSV Schema 契约（与项目现有表格一致）\n\n**nodes.csv**：`node_id,node_type,name,description,source`\n- node_id：snake_case，如 `hello_timer_mismatch`、`combo_auth_area`\n- node_type：fault / state / device / symptom / protocol / rule / composite_fault / tlv\n- source：RFC 编号（RFC1195/RFC3358/RFC5301）/ `rule:\u003cfile\u003e.json` /\n  `scenario` / `combo_lib` / 素材文件名\n\n**edges.csv**：`source_id,relation,target_id,description`\n- 常用 relation：causes / prevents / indicates / has_state / combines\n- 复合故障必须用 combines 分解到各子故障节点（kg-validator B 类强制）\n\n**node_attributes.csv**：`node_id,attribute,value`\n- 用于 TLV 编码等属性，如 `TLV_AREA_ADDR,code,1`\n\n## 使用方法\n\n```bash\ncd /home/hermes/workspace\n\n# 1. 从素材提取候选表格（不修改现有知识库）\npython3 skills/material-to-csv/run.py extract \u003c素材文件\u003e --source RFC5301\n\n# 2. 查看与现有知识库的差异（新增/重复/冲突）\npython3 skills/material-to-csv/run.py diff knowledge/incoming/\u003c批次目录\u003e\n\n# 3. 人工确认后合并进 knowledge/tables/（自动快照备份）\npython3 skills/material-to-csv/run.py merge knowledge/incoming/\u003c批次目录\u003e\n\n# 4. merge 已自动重建本地图谱、校验并刷新检索输入\n# 如需同时更新索引，加 --index（需要模型服务）\npython3 skills/material-to-csv/run.py merge knowledge/incoming/\u003c批次目录\u003e --index\n```\n\n## 支持的素材类型与提取策略\n\n| 素材类型 | 识别方式 | 提取策略 |\n|---------|---------|---------|\n| RFC 摘要/全文（.txt/.md） | --source RFC* | 正则提取\"症状→原因\"句式、TLV 定义表、状态机条目 |\n| IS-IS 日志（.log） | --source log:\u003c文件名\u003e | 提取事件类型，映射到已有 fault/state 节点；未知事件标 candidate |\n| 既有 CSV/表格 | --source table:\u003c文件名\u003e | 列名映射到标准 schema，校验后直通 |\n| 诊断规则 JSON | --source rule:\u003c文件名\u003e | 提取规则名/描述为 rule 类型节点 |\n\nLLM 辅助提取：正则覆盖不了的自由文本，由 Hermes（即执行者本人）按\n`references/extraction-guide.md` 的句式清单人工/LLM 判读后补写候选行，\n排障与验证流程见 `references/verification-walkthrough.md`（含\"提取不生效\"三类根因与六步验证法），\n写入批次目录的 `manual_nodes.csv` / `manual_edges.csv`，merge 时一并处理。\n\n## 输出结构\n\n```\nknowledge/incoming/\u003cbatch_ts\u003e/\n  candidate_nodes.csv      # 提取出的候选节点\n  candidate_edges.csv      # 提取出的候选边\n  manual_nodes.csv         # （可选）人工/LLM 补写\n  diff_report.md           # 与现有库的 新增/重复/冲突 对比\n  merge_snapshot/          # merge 时自动备份合并前的 tables/\n```\n\n## 冲突处置\n\n- **完全重复**（node_id 相同且描述一致）：跳过，不计入合并\n- **同 ID 不同内容**：列入 diff_report 的\"冲突\"段，merge 时默认保留旧值，\n  `--prefer-new` 才覆盖；每次覆盖记录到批次目录\n- **新节点**：正常合并；若 node_type=composite_fault 而无 combines 边，\n  给出 WARN（合并后 kg-validator B 类会报 MAJOR）\n\n## 注意事项\n\n- 本 skill 幂等：重复 extract 同一素材产生相同候选文件（覆盖写）\n- merge 前自动快照 `knowledge/tables/` 到批次目录，回滚 = 快照拷回\n- 合并后自动重跑 `knowledge/scripts/build.py` 和 `kg-validator`，并刷新检索输入；\n  默认不构建 GraphRAG 索引，用 `merge --index` 或 knowledge-builder 的 graphrag-index 更新索引\n- 后续构建/校验失败返回非零，但已合并表格保留，可用 merge_snapshot 回滚\n- 路径默认由脚本位置确定，可用 WORKSPACE 环境变量指定数据工作区\n- 甲方离线环境素材通常经由 U 盘导入 `config/knowledge_tables/`，\n  用 `extract --source table:\u003c文件\u003e` 规整格式\n"},{"id":"skill-definitions/workspace-orchestrator.md","path":"evidence/skill-definitions/workspace-orchestrator.md","name":"workspace-orchestrator.md","size":8232,"sha256":"5def95b0fa063dd9272224efbf930040acf311e9794fd2754437c693427cf67f","binary":false,"content":"---\nname: workspace-orchestrator\ndescription: \"54所 IS-IS 智能分析平台统一工作流编排技能：生成数据→构建知识→启动GraphRAG→运行分析→批判性审查→展示前端。执行各阶段之间，Hermes 必须以 LLM 推理身份介入，记录思考、判断与决策，体现分析能力\"\nversion: 3.0.0\nauthor: agent-analysis team\n---\n\n# workspace-orchestrator\n\n## 触发条件\n\n- 用户要求\"生成并分析\"、\"跑一遍工作流\"、\"演示 IS-IS 故障分析\"\n- 用户提到\"pcap\"、\"log\"、\"GraphRAG\"、\"前端\"、\"分析\"等多个关键词\n- 用户想验证某个场景（如 baseline、link-down、auth-mismatch、复合故障组合 combo-*）\n\n## 核心原则：Hermes 全程 LLM 参与\n\n本 skill 不是\"照脚本跑一遍\"的自动化：**Hermes 是执行者，更是分析者**。\n每个阶段之间，Hermes 必须停下来、阅读中间产物、用自己的判断推进流程。\n具体而言，Hermes 在每个阶段后都要输出一段\"阶段推演记录\"，包含三要素：\n\n1. **看见了什么**（观察）：简明列出该阶段产物的关键数值、事件、信号\n2. **我的判断**（推理）：基于观察给出初步判断、可能原因、风险点，不要复述脚本输出\n3. **下一步决策**（决策）：说明为什么选择下一步、预期得到什么、如何验证\n\n这些推演记录必须以 `【Hermes 推演 · 阶段名】` 为标题呈现给用户，\n让甲方能看到 LLM 在每个环节的思考过程，而不是只见最终报告。\n\n## 执行阶段\n\n### 阶段一：生成数据（generate）\n\n```bash\npython3 skills/workspace-orchestrator/run.py \u003cscenario\u003e --run-id \u003crun_id\u003e --stage generate\n```\n\n- 支持单场景：`link-down`、`auth-mismatch`、`combo-auth-area` 等全部 20+ 场景\n- 产物在 `isis-simulator/output/\u003crun_id\u003e/`（pcapng/ + logs/）\n- 复合故障场景（combo-*）会同时生成叠加了两个故障特征的 pcap 与合并日志\n\n**【Hermes 推演 · 生成数据】**：读取生成的 pcap/log 文件清单与大小，\n先不运行分析，仅凭场景名与文件结构预估：本场景可能在哪个阶段（before/fault/after）\n注入异常、日志事件会指向哪些故障类型。将判断写入推演记录。\n\n### 阶段二：准备输入（prepare）\n\n```bash\npython3 skills/workspace-orchestrator/run.py \u003cscenario\u003e --run-id \u003crun_id\u003e --stage prepare\n```\n\n将 pcap/log 复制到 `agent-analysis/data/incoming/\u003crun_id\u003e/`。\n\n**【Hermes 推演 · 准备输入】**：确认输入完整（pcap 与 log 成对、数量对得上）。\n若发现缺文件，应先向用户说明并决定如何处理，再继续。\n\n### 阶段三：构建知识（build_knowledge）\n\n```bash\npython3 skills/workspace-orchestrator/run.py \u003cscenario\u003e --run-id \u003crun_id\u003e --stage build_knowledge\n```\n\n- 更新 `knowledge/tables/nodes.csv`、`edges.csv` 和 knowledge_graph.json\n- 自动运行 kg-validator，CRITICAL 时停止后续流程；可用 `--knowledge-batch \u003c已审阅批次目录\u003e` 合并素材\n- 生成 `graphrag/input/knowledge_graph.txt`\n\n**【Hermes 推演 · 构建知识】**：阅读 `knowledge/tables/nodes.csv`，\n确认本次场景的相关故障节点/复合故障节点（composite_fault）是否已在知识库中。\n说明这些知识将如何辅助本次诊断。\n\n### 阶段四：构建索引（build_index）\n\n```bash\npython3 skills/workspace-orchestrator/run.py \u003cscenario\u003e --run-id \u003crun_id\u003e --stage build_index\n```\n\n构建/更新 GraphRAG 索引前自动校验本地图谱并刷新检索输入（耗时较长，可复用已有索引则用 `--skip-knowledge`）。\n\n**【Hermes 推演 · 构建索引】**：说明索引规模变化，预估查询时延与可能的降级路径。\n\n### 阶段五：启动 GraphRAG 服务（start_rag）\n\n```bash\npython3 skills/workspace-orchestrator/run.py \u003cscenario\u003e --run-id \u003crun_id\u003e --stage start_rag\n```\n\n【Hermes 推演 · 启动服务】：确认 `/health` 正常、索引构建时间、模型配置\n（chat 模型 / embedding 模型）。\n\n### 独立校验阶段（validate）\n\n```bash\npython3 skills/workspace-orchestrator/run.py --stage validate --graphrag-port 9200\n```\n\n检查知识表格、图谱与可用 GraphRAG 服务，报告写入 knowledge/learnings/validation/。\nanalyze 阶段也自动执行该检查；CRITICAL 阻止诊断。\n\n### 阶段六：运行分析（analyze）\n\n```bash\nexport GRAPHRAG_ENABLED=true\npython3 -m agent_analysis --input agent-analysis/data/incoming/\u003crun_id\u003e\n```\n\n分析引擎依次执行：加载数据 → 特征提取（分层统计 + pcap 信号）→ 知识查询（GraphRAG）→\nL1/L2/L3/L4 规则匹配 → LLM 辅助诊断 → 生成报告。\n\n- 报告：`agent-analysis/output/reports/run_\u003ctimestamp\u003e.md`\n- 追踪：`agent-analysis/data/traces/run_\u003ctimestamp\u003e.json`\n\n**【Hermes 推演 · 规则匹配】**：读取报告中的\"pcap 协议信号\"\"命中规则\"章节，\n逐一核对：命中规则的依据是否强信号、有无误报、复合故障是否被完整识别。\n\n**【Hermes 推演 · LLM 诊断】**：阅读\"LLM 诊断结论\"章节，评价结论是否与\n命中规则、知识引用、证据链一致，指出结论中的推理环节与可能的缺陷。\n\n### 阶段七：批判性审查（critic）— 必需步骤\n\n```bash\npython3 skills/workspace-orchestrator/run.py \u003cscenario\u003e --run-id \u003crun_id\u003e --stage critic\n```\n\nHermes 必须启动一个**批判性子智能体（isis-critic）**对诊断报告进行独立审查。\n批判子智能体职责：\n\n- 读取 `skills/workspace-orchestrator/references/critic-checklist.md` 检查清单\n- 逐项核查：数据完整性/特征提取/规则命中/知识引用/LLM 结论质量/复合故障专项\n- 输出结构化批判意见（问题等级 CRITICAL/MAJOR/MINOR/INFO，含证据、风险、建议）\n- 写入 `agent-analysis/output/reports/run_\u003ctimestamp\u003e.critique.md`\n\n**【Hermes 推演 · 批判审查】**：调用子智能体后，汇总批判子智能体发现的\n问题清单，判断哪些必须修正、哪些是改进建议，并说明采纳/拒绝的理由。\n\n### 阶段八：汇总呈现（report）\n\n```bash\npython3 skills/workspace-orchestrator/run.py \u003cscenario\u003e --run-id \u003crun_id\u003e --stage report\n```\n\n输出完整报告 + 批判意见。\n\n**【Hermes 推演 · 总结交付】**：综合报告、批判意见与自身判断，输出给用户的\n最终结论：根因、影响、排查步骤，并明确标注结论的可信度与剩余不确定项。\n\n### 阶段九：前端展示（frontend，可选）\n\n```bash\npython3 skills/workspace-orchestrator/run.py \u003cscenario\u003e --run-id \u003crun_id\u003e --stage frontend\n```\n\n启动 `http://localhost:8080`。\n\n## 一键全流程模式（供快速验证）\n\n```bash\npython3 skills/workspace-orchestrator/run.py \u003cscenario\u003e [--skip-knowledge] [--frontend]\n```\n\n全流程模式下，Hermes 仍须在脚本输出后补充推演记录与批判环节，\n不得直接结束对话而不呈现分析过程。\n\n## 环境要求\n\n- 工作目录：`/home/hermes/workspace`\n- Python 3.10+\n- 纯离线/内网环境；GraphRAG chat 模型经 `graphrag/config/settings.yaml` 配置\n- 甲方内网 vLLM 端点配置在 `agent-analysis/.env.project`\n\n## 输出位置\n\n| 产物 | 路径 |\n|------|------|\n| 诊断报告 | `agent-analysis/output/reports/run_\u003ctimestamp\u003e.md` |\n| 批判意见 | `agent-analysis/output/reports/run_\u003ctimestamp\u003e.critique.md` |\n| 执行时序图 | `agent-analysis/output/sequence_diagrams/run_\u003ctimestamp\u003e.html` |\n| 追踪记录 | `agent-analysis/data/traces/run_\u003ctimestamp\u003e.json` |\n| GraphRAG 索引 | `graphrag/output/` |\n| 知识表 | `knowledge/tables/*.csv` |\n\n## 注意事项\n\n- GraphRAG 服务默认占用 9200 端口，前端默认占用 8080 端口\n- 分析结果保存在 `agent-analysis/output/reports/` 和 `agent-analysis/data/traces/`\n- 工作流结束后，前端服务保持运行；GraphRAG 服务会被关闭\n- 若 LLM 不可达，诊断报告仍会继续生成，LLM 结论部分会提示连接失败\n- **批判性审查为必需步骤**；若批判子智能体不可用，Hermes 应停止并说明原因\n- **复合故障场景**：通过 `run.py combo-\u003c故障A\u003e-\u003c故障B\u003e` 触发，详见\n  `isis-simulator/src/isis_simulator/scenarios/combo_lib.py` 的 `COMBO_FAULTS`"},{"id":"source-rules.json","path":"evidence/source-rules.json","name":"source-rules.json","size":2578,"sha256":"11470ea487ad75548fec805a9f8e51030df6a94f92cca19c84f74590d3f33980","binary":false,"content":"{\n  \"layer\": \"L2\",\n  \"name\": \"链路层\",\n  \"description\": \"检查IS-IS Hello、邻接、认证、MTU等链路层状态\",\n  \"rules\": [\n    {\n      \"id\": \"L2-R001\",\n      \"name\": \"adjacency_down\",\n      \"description\": \"IS-IS邻接关系Down\",\n      \"indicators\": [\n        \"adjacency_down\",\n        \"Adjacency\",\n        \"Down\"\n      ],\n      \"severity\": \"critical\",\n      \"affected_layers\": [\n        \"L2\",\n        \"L3\"\n      ],\n      \"suggestion\": \"检查链路状态、Hello定时器、认证配置\",\n      \"pcap_indicators\": [\n        \"NEIGHBOR_LOSS_AT_FAULT\"\n      ],\n      \"references\": [\n        \"RFC 1195 Section 6\"\n      ]\n    },\n    {\n      \"id\": \"L2-R002\",\n      \"name\": \"auth_failure\",\n      \"description\": \"IS-IS认证失败\",\n      \"indicators\": [\n        \"auth_fail\",\n        \"Authentication failed\"\n      ],\n      \"severity\": \"critical\",\n      \"affected_layers\": [\n        \"L2\"\n      ],\n      \"suggest ,19).replace('T',' '))}<br>恢复验证：未提供</small></div></section><div class="provenance"><span>◉</span><span>页面读取本任务的项目运行产物 · ${modelNote} · 回放控制记录展开，不重新执行诊断</span><button class="btn link" data-asset="generation.json">查看来源 ↗</button></div><div id="view">${({overview:overview,evidence:evidenceView,model:modelView,skills:skillsView,report:reportView})[view]()}</div><div class="source-foot"><span>输入为受控合成场景 · 规则 / 知识 / 追踪来自项目实际执行 · 恢复未验证</span><span id="live-status">${esc(D.view_mode)} · ${esc(D.built_at.slice(0,19).replace('T',' '))}</span></div></main></div>`}
function process(){return `<section class="card process"><header class="head"><div><h2>诊断执行链</h2><p>按本次实际流水线展开</p></div>${badge(stages().length+' 阶段','blue')}</header><div class="process-list">${stages().map((s,i)=>`<button class="stage ${i===selected?'active':''} ${i<=reveal?'seen':''} ${s.status==='FAIL'?'hit':''}" data-stage="${i}" aria-pressed="${i===selected}"><span class="number">${i<=reveal?(s.status==='FAIL'?'!':'✓'):String(i+1).padStart(2,'0')}</span><span class="stage-text"><b>${esc(s.name)}</b><small>${stageSkill(s.id)}</small></span><span class="stage-state">${i>reveal?'待展开':s.id==='llm'&&!currentModelReal()?'示例':roleLabel(s.status)}</span></button>`).join('')}</div><div class="replay-controls"><button class="btn primary" id="replay">${playing?'Ⅱ 暂停复盘':'▷ 从报障复盘'}</button><button class="btn" id="complete">完整结果</button><select id="speed" aria-label="复盘速度"><option value="0.6" ${speed===.6?'selected':''}>慢速</option><option value="1" ${speed===1?'selected':''}>正常</option><option value="1.8" ${speed===1.8?'selected':''}>快速</option></select><input id="progress" type="range" min="0" max="${stages().length-1}" value="${reveal}" aria-label="分析步骤"></div><div class="process-note">flow-tracer 全程记录<br>显示节奏不等于实际执行耗时</div></section>`}
function network(){const visible=reveal>=1,s=visible?phase:'before',nodes=['R01','R02'],bad=visible&&s==='fault';
const checkIndex=stages().findIndex(step=>step.id==='L2');
const ruleChecked=checkIndex>=0&&reveal>=checkIndex&&D.result.anomalies.some(a=>a.layer==='L2'&&a.rule.name==='circuit_type_mismatch');
const linkLabel=!visible?'等待提取报文':!bad?'正常观测窗口':ruleChecked?'规则：层级不兼容':'Hello 类型不同';
const color=bad?'#c99445':'#64a693';return `<div class="network"><svg viewBox="0 0 500 210" role="img" aria-label="来自输入状态的R01和R02观测链路"><path d="M150 95H345" stroke="${visible?color:'#becfe2'}" stroke-width="2" ${bad?'stroke-dasharray="5 4"':''}/><rect x="197" y="80" width="108" height="24" rx="12" fill="${bad?'#fff2dd':'#edf5f2'}"/><text x="251" y="96" font-size="10" fill="${color}" text-anchor="middle">${linkLabel}</text>${nodes.map((n,i)=>{const x=i?375:120;return `<rect x="${x-38}" y="66" width="76" height="57" rx="10" fill="${i&&bad?'#fff8ed':'#fff'}" stroke="${i&&bad?color:'#c2d4e8'}"/><path d="M${x-23} 80h15v14h-15zM${x-20} 84h9M${x-20} 89h5" fill="none" stroke="#90a9c6"/><text x="${x+14}" y="94" font-size="12" text-anchor="middle" fill="#527492">${n}</text><text x="${x}" y="141" text-anchor="middle" font-size="10" fill="${i&&bad?color:'#829ab5'}">${visible?esc(types(s,n)):'字段尚未展开'}</text><text x="${x}" y="160" text-anchor="middle" font-size="8" fill="#a0b1c4">Gig0/0/0</text>`}).join('')}<path d="M375 174v15H250" fill="none" stroke="#c7d7e8"/><text x="250" y="204" text-anchor="middle" font-size="9" fill="#91a6bf">业务环回地址 ${esc(D.state.topology.service_target)} · ${visible?(bad?'探测未见应答':'探测有应答'):'待核对探测'}</text></svg></div>`}
function observationContent(){return `<div class="observation"><span class="time-tag">${esc(D.incident.reported_at)} · ${esc(D.incident.id)}</span><b>${esc(D.incident.description)}</b><p>期望：邻接稳定、业务环回地址可达。观测：邻接中断，探测连续无应答。</p></div><div class="buttons" style="margin-top:12px"><button class="btn link" data-asset="device-events.log">原始日志 ↗</button><button class="btn link" data-asset="incident.json">报障记录 ↗</button></div><h3 class="section-gap">本次接收的输入</h3>${file('link-observation.pcap','原始抓包')}${file('device-events.log','设备日志')}${file('network-state.json','设备状态与配置')}<div class="note">从故障现象开始，下一步提取报文与日志证据。</div>`}
function measuredContent(){const snapshot=snap(phase),probe=D.packet_features.icmp[phase]||{};return `<div class="buttons" style="justify-content:space-between"><h3 style="margin:0">协议与链路观测</h3><div class="switch">${[['before','正常基线'],['fault','异常窗口']].map(([id,l])=>`<button data-phase="${id}" aria-pressed="${phase===id}" class="${phase===id?'active':''}">${l}</button>`).join('')}</div></div>${network()}<div class="mini-grid"><div><label>接口物理状态</label><strong>${esc(snapshot.nodes.map(n=>n.node+': '+n.physical_state).join(' / '))}</strong><p>有限快照，未作全时段证明</p></div><div><label>业务探测</label><strong>${probe.req||0} 请求 / ${probe.reply||0} 应答</strong><p>请求与应答计数来自抓包</p></div><div><label>邻接状态</label><strong>${esc(snapshot.nodes.map(n=>n.node+': '+n.adjacency).join(' / '))}</strong><p>来自设备状态快照</p></div></div><div class="note">抓包时间轴与诊断执行时间轴分别展示。此输入没有修复后窗口。</div>`}
function evidenceFacts(){return `<h3 class="section-gap">证据如何连接</h3><div class="facts"><div class="fact"><small>PACKET / 原始报文</small><b>R02 Hello 类型发生变化</b><p>${esc(types('before','R02'))} → ${esc(types('fault','R02'))}；R01 在两个窗口均为 ${esc(types('fault','R01'))}。</p><button class="btn link" data-asset="packet-features.json">核对字段 ↗</button></div><div class="fact"><small>STATE / 状态与配置</small><b>R02 配置与报文一致</b><p>R02 有效层级 ${esc(stateNode('before','R02').process_is_type)} → ${esc(stateNode('fault','R02').process_is_type)}。</p><button class="btn link" data-asset="network-state.json">配置快照 ↗</button></div><div class="fact"><small>LOG / 故障现象</small><b>邻接中断，探测无应答</b><p>日志记录配置提交与邻接变化，抓包独立提供探测应答计数。</p><button class="btn link" data-asset="device-events.log">事件原文 ↗</button></div></div>`}
function outcomeContent(){return `<div class="outcome"><h3>${esc(D.summary.title)}</h3><p>${esc(D.summary.basis)}邻接中断与探测无应答是关联表现；${D.result.anomalies.length} 条命中不能直接计作 ${D.result.anomalies.length} 个独立故障。</p></div><div class="note amber">${currentModelReal()?'模型真实返回已记录。':'本任务的模型解读为示例；未调用配置模型。'} 建议处置尚未执行，恢复未验证。</div>`}
function stageContent(stage){
 if(stage.id==='load')return observationContent();
 if(stage.id==='feature')return measuredContent()+evidenceFacts();
 if(stage.id==='knowledge')return `<p class="intro">根据日志事件和报文信号查询已准备的 CSV 图谱，供后续模型解释原因、影响和排查方法。</p><div class="note" style="margin-top:0">实际查询：${D.knowledge.queries.map(esc).join('、')}。返回 ${D.knowledge.hits.length} 个节点。知识查询结果不参与规则命中判断。</div><h3 class="section-gap">查询返回的知识节点</h3>${D.knowledge.hits.map(n=>`<div class="rule"><div class="rule-icon">KG</div><div><b>${esc(n.name)}</b><p>${esc(n.description)}</p></div></div>`).join('')}${file('knowledge-query.json','查询词与完整返回')}`;
 if(['L1','L2','L3','L4'].includes(stage.id)){const matches=D.result.anomalies.filter(a=>a.layer===stage.id);return `<p class="intro">本步使用已提取的日志事件和报文信号匹配${esc(stage.name)}规则。</p><div class="observation"><b>${esc(stage.detail)}</b><p>PASS 表示未命中现有规则，不代表全面健康证明。</p></div>${matches.map(a=>`<div class="rule"><div class="rule-icon">${esc(a.layer)}</div><div><b>${esc(a.rule.id)} · ${esc(a.rule.description)}</b><p>${esc(a.rule.suggestion)}</p></div>${badge('命中','amber')}</div>`).join('')}${stage.id==='L1'?'<div class="note">已观测接口 UP、错误计数未增长；有限采样不能排除所有物理问题。</div>':stage.id==='L3'?'<div class="note">L3-R004 与链路层同名故障属于同一候选模式，多层命中不等于多个独立根因。</div>':stage.id==='L4'?'<div class="note">探测退化属于已观测的业务影响，需要结合协议和配置证据分析根因。</div>':''}<h3 class="section-gap">本步关联的观测</h3>${measuredContent()}${file('source-rules.json','核对规则材料')}`}
 if(stage.id==='llm')return outcomeContent()+`<h3 class="section-gap">综合诊断与候选比较</h3><div class="md">${md(asset('model-response.md')?.content||'配置模型尚未返回可用结果。')}</div><div class="buttons section-gap"><button class="btn" data-asset="model-call.json">完整输入与来源</button><button class="btn" data-view="model">查看模型诊断</button></div>`;
 return outcomeContent()+`<h3 class="section-gap">诊断产物</h3>${file('diagnosis-report.md','项目生成的诊断报告')}${file('analysis-trace.json','完整执行追踪')}${file('critique.md','独立审查')}<div class="buttons section-gap"><button class="btn primary" data-view="report">阅读完整报告</button><button class="btn" data-download="diagnosis-report.md">导出报告 ↓</button></div>`;
}
function inspector(s){const entry={
 load:['原始报障、PCAP、日志和设备状态。','识别输入文件并交给特征提取。',[['link-observation.pcap','原始抓包'],['device-events.log','原始日志'],['network-state.json','设备状态与配置']]],
 feature:['报文内容、全部日志、设备状态快照。','得到 Hello 类型变化、探测应答退化和事件特征。',[['features.json','实际提取特征'],['packets.json','逐条解码']]],
 knowledge:['日志事件、报文信号和已准备知识表。',`加载 ${D.knowledge.stats.total_nodes} 个节点、${D.knowledge.stats.total_edges} 条关系；返回 ${D.knowledge.hits.length} 个节点。`,[['knowledge-query.json','查询词与实际返回'],['knowledge-validation.md','分析前知识校验']]],
 L1:['物理层规则及当前已提取的特征。','未命中本层规则；结合 UP 和计数快照降低完整物理断链的优先级。',[['network-state.json','物理接口观测'],['analysis-trace.json','原始检查事件']]],
 L2:['邻接事件、Hello 类型、认证、定时器和链路层规则。','邻接异常与层级变化分别触发规则。',[['source-rules.json','链路层规则'],['features.json','匹配的协议信号']]],
 L3:['路由层规则及协议字段。','层级不兼容再次命中；与链路层同名模式归并。',[['analysis-result.json','实际命中规则'],['network-state.json','路由和配置快照']]],
 L4:['端到端探测计数与应用层规则。','探测退化触发业务连通性规则；作为关联影响分析。',[['packet-features.json','请求与应答计数'],['analysis-result.json','应用层命中']]],
 llm:['原始日志、协议统计、配置、命中规则及知识引用。',currentModelReal()?'配置模型返回综合判断、候选比较和处置建议。':'按相同提示和证据生成示例解读；配置模型未调用。',[['model-call.json','完整模型输入与来源'],['model-response.md','证据解读输出']]],
 report:['特征、知识、规则与模型辅助内容。','项目引擎保存报告和追踪；独立审查核对证据边界。',[['diagnosis-report.md','实际生成的报告'],['critique.md','独立 LLM 审查'],['skill-audit.json','技能应用记录']]]
 }[s.id]||['输入','输出',[]];return `<aside class="card inspector"><div class="inspector-head"><div class="eyebrow">STEP ${String(selected+1).padStart(2,'0')} / 执行详情</div>${badge(s.id==='llm'&&!currentModelReal()?'示例解读':roleLabel(s.status),s.status==='FAIL'?'amber':'blue')}<h2>${esc(s.name)}</h2><button class="skill-pill" data-skill="${stageSkill(s.id)}">${stageSkill(s.id)} ↗</button><div class="duration"><span>${esc(s.started_at.slice(11,23))}</span><span>${millis(s.duration_ms)}</span></div></div><div class="inspector-body"><div class="inspector-row"><label>输入</label><p>${entry[0]}</p></div><div class="inspector-row"><label>输出</label><p>${entry[1]}</p></div><div class="inspector-row"><label>该技能的作用</label><p>${esc(D.skills[stageSkill(s.id)].role)}</p></div><div class="inspector-row"><label>实际运行记录</label><p>${esc(s.detail)}</p></div><div class="inspector-row"><label>可核对的产物</label>${entry[2].filter(([id])=>asset(id)).map(([id,l])=>file(id,l)).join('')}</div></div></aside>`}
function overview(){const stage=stages()[selected];return `<div class="metrics">${[[D.packets.length,'原始报文','全部逐条解析'],[D.log_features.raw_lines.length,'原始日志','含正常与异常事件'],[D.result.anomalies.length,'规则命中','跨层归因需合并'],[Object.keys(D.rule_groups).length,'候选模式','区别根因与后果']].map(([n,l,s])=>`<div class="metric"><strong>${n}</strong><label>${l}<span>${s}</span></label></div>`).join('')}</div><div class="layout">${process()}<section class="card stage-workspace" aria-labelledby="current-stage-title"><header class="head workspace-head"><div><div class="eyebrow">STEP ${String(selected+1).padStart(2,'0')} / 当前环节</div><h2 id="current-stage-title">${esc(stage.name)}</h2></div><div class="buttons">${badge(stage.id==='llm'&&!currentModelReal()?'示例解读':roleLabel(stage.status),stage.status==='FAIL'?'amber':'blue')}<button class="btn mobile-detail" id="stage-details">执行详情</button></div></header><div class="stage-content" role="region" aria-label="当前环节内容" tabindex="0">${stageContent(stage)}</div><footer class="step-navigation"><button class="btn" id="previous-stage" ${selected===0?'disabled':''}>← 上一步</button><span role="status" aria-live="polite">${selected+1} / ${stages().length} 环节</span><button class="btn" id="next-stage" ${selected===stages().length-1?'disabled':''}>下一步 →</button></footer></section>${inspector(stage)}</div><div class="trace-foot"><span>flow-tracer · ${D.trace.steps.length} 条原始事件 · ${D.trace.errors.length} 个执行错误</span><button class="btn link" data-view="skills">查看完整执行 →</button></div>`}

function evidenceView(){const filtered=D.packets.filter(p=>(filterStage==='all'||p.stage===filterStage)&&(filterKind==='all'||(filterKind==='isis'?p.kind==='isis':p.kind==='ipv4'))&&(filterNode==='all'||p.source_id===sid(filterNode))&&(!search||JSON.stringify(p).toLowerCase().includes(search.toLowerCase())));return `<div class="view-title"><div><h2>输入与原始证据</h2><p>输入来自同一场景生成与准备入口；每个文件可以核对哈希并下载原件。</p></div>${badge('项目输入 3 份','blue')}</div><section class="view-panel"><div class="asset-grid">${[['link-observation.pcap','原始抓包','IEEE 802.3 / LLC 与 ICMP；只有基线和异常'],['device-events.log','设备事件日志','记录故障现象，未写入诊断根因'],['network-state.json','采集状态快照','接口、层级配置、邻接和路由观测']].map(([id,l,p])=>`<div class="asset-tile"><b>${l}</b><p>${p}</p><p class="code">${id} · ${kb(asset(id).size)}</p><div class="buttons"><button class="btn" data-asset="${id}">查看</button><button class="btn" data-download="${id}">下载 ↓</button></div></div>`).join('')}</div></section><section class="view-panel"><div class="view-title"><div><h2>逐条报文解码</h2><p>${filtered.length} / ${D.packets.length} 条 · 点击报文查看解码字段</p></div><button class="btn" data-download="packets.json">导出解码</button></div><div class="filter"><select id="packet-stage" aria-label="时间窗口">${[['all','全部窗口'],['before','正常基线'],['fault','异常窗口']].map(([v,l])=>`<option value="${v}" ${filterStage===v?'selected':''}>${l}</option>`).join('')}</select><select id="packet-kind" aria-label="协议">${[['all','全部协议'],['isis','IS-IS'],['icmp','ICMP']].map(([v,l])=>`<option value="${v}" ${filterKind===v?'selected':''}>${l}</option>`).join('')}</select><select id="packet-node" aria-label="节点">${['all','R01','R02','R03','R04'].map(v=>`<option value="${v}" ${filterNode===v?'selected':''}>${v==='all'?'全部节点':v}</option>`).join('')}</select><input id="packet-search" aria-label="搜索字段" placeholder="搜索 System ID、MAC、Hello 类型…" value="${esc(search)}"></div><div class="table"><table><thead><tr><th>帧号</th><th>相对时间</th><th>窗口</th><th>源 System ID</th><th>报文类型</th><th>Circuit type</th><th>Holding</th><th>长度</th></tr></thead><tbody>${filtered.map(p=>`<tr class="clickable" data-packet="${p.frame}"><td>${p.frame}</td><td>T+${p.relative_s.toFixed(3)}s</td><td>${p.stage==='before'?'基线':'异常'}</td><td class="code">${p.source_id||'—'}</td><td>${p.pdu_type_name||(p.icmp_type===8?'ICMP 请求':'ICMP 应答')}</td><td>${p.circuit_type?'0x'+p.circuit_type.toString(16).padStart(2,'0'):'—'}</td><td>${p.holding_timer?p.holding_timer+'s':'—'}</td><td>${p.size} B</td></tr>`).join('')}</tbody></table></div><div class="note">IS-IS 的 Level 1 / Level 2 是协议运行层级；诊断流水线的 L1 / L2 则分别指物理层 / 链路层。</div></section>`}
function modelView(){const real=currentModelReal();const content=asset('model-response.md')?.content||'配置模型尚未返回可用结果。';return `<div class="view-title"><div><h2>大模型辅助诊断</h2><p>模型综合事实与知识，比较候选原因，区别根因、后果和待验证事项。</p></div>${badge(real?'真实模型返回':D.model_mode==='illustrative'?'证据解读示例':'调用未完成',real?'green':'amber')}</div><div class="model-label ${real?'real':''}">${real?'本次调用使用项目配置的模型接口，完整输入、返回和耗时已保存。':D.model_mode==='illustrative'?'当前解读按项目实际提示与已提取证据编写，用于展示模型环节；未向配置模型接口发送请求。独立 LLM 审查另有真实记录。':'配置模型调用未成功；请查看模型调用记录中的原因。'}</div><section class="view-panel"><div class="model-meta"><div><label>模型 / 来源</label><b>${esc(D.model.model||'未调用')}</b></div><div><label>输入</label><b>协议、日志、状态、规则、知识</b></div><div><label>记录时间</label><b>${esc(D.model.started_at?.slice(11,23)||'—')}</b></div><div><label>${real?'调用耗时':'示例装载耗时'}</label><b>${millis(D.model.duration_ms||0)}</b></div><div><label>参数</label><b>temperature 0.1 / 2048 tokens</b></div></div><div class="model-comparison"><section class="model-column" aria-labelledby="model-evidence-title"><header class="model-column-head"><h3 id="model-evidence-title">模型收到的证据</h3><p>完整项目提示 · ${D.model.prompt?.length||0} 字符</p></header><div class="model-column-body model-evidence" role="region" aria-label="模型输入证据" tabindex="0"><pre class="raw">${esc(D.model.prompt||'暂无')}</pre></div><footer class="model-column-foot"><button class="btn" data-asset="model-call.json">请求与来源记录</button><button class="btn" data-asset="knowledge-query.json">知识上下文</button></footer></section><section class="model-column" aria-labelledby="model-interpretation-title"><header class="model-column-head"><h3 id="model-interpretation-title">综合诊断与候选比较</h3><p class="model-scroll-hint">滚动任一侧，左右同步查看</p></header><div class="model-column-body model-interpretation" role="region" aria-label="模型诊断解读" tabindex="0"><div class="md">${md(content)}</div></div><footer class="model-column-foot"><button class="btn" data-download="model-response.md">导出解读</button></footer></section></div></section>`}
function skillsView(){const def=D.skills[skill];return `<div class="view-title"><div><h2>Skills 与实际执行</h2><p>技能负责不同阶段；点击查看入口、输入输出和对应产物。追踪记录与技能应用记录分别保存。</p></div>${badge('7 类项目技能','blue')}</div><div class="skill-grid">${Object.entries(D.skills).map(([id,s])=>`<button class="skill-card ${skill===id?'active':''}" data-skill="${id}"><span class="skill-pill">${id}</span><h3>${s.name}</h3><p>${esc(s.role)}</p></button>`).join('')}</div><section class="view-panel"><div class="view-title"><div><h2>${def.name} · ${skill}</h2><p>${esc(def.role)}</p></div><button class="btn" data-asset="skill-definitions/${skill}.md">查看 SKILL 定义</button></div><div class="two-cols"><div>${file(def.artifact,'对应执行产物')}${file('skill-audit.json','本任务的技能应用与交接')}</div><div class="note" style="margin-top:0">技能由执行代理按项目 SKILL.md 应用。引擎阶段由对应模块实现；没有把职责标签伪装成独立 skill API 调用。配置模型诊断与独立审查各自标明来源。</div></div></section><section class="view-panel"><div class="view-title"><div><h2>诊断前的知识准备</h2><p>副本实际执行并供本任务加载 · ${D.preparation.before_nodes} → ${D.preparation.after_nodes} 个节点 · 未重建 GraphRAG 索引</p></div><button class="btn" data-asset="preparation.json">执行清单</button></div><div class="progress-audit">${D.preparation.stages.map(s=>`<button class="item" data-asset="${s.artifact.replace('evidence/','')}"><b>${esc(s.skill)}</b><small>${esc(s.id)} · ${s.returncode===0?'成功':'失败'} · ${millis(s.duration_ms)}</small></button>`).join('')}</div><details><summary>知识校验保留的问题与跳过项</summary>${D.validation.filter(v=>['MAJOR','MINOR','SKIP','CRITICAL'].includes(v.level)).map(v=>`<div class="validation-item">${badge(v.level,v.level==='SKIP'?'':'amber')}<div><b>${esc(v.title)}</b><p>${esc(v.evidence)}</p></div></div>`).join('')}</details></section><section class="view-panel"><div class="view-title"><div><h2>flow-tracer 全程事件</h2><p>原始状态 FAIL 表示规则命中；ERROR 表示执行失败。</p></div><button class="btn" data-download="analysis-trace.json">导出追踪</button></div>${D.trace.steps.map(e=>`<div class="event"><span class="seq">${String(e.seq).padStart(2,'0')}</span><span class="time">${esc(e.timestamp)}</span><b>${esc(e.action)}</b><p>${esc(e.detail||'阶段开始')}</p>${badge(e.layer==='llm'&&!currentModelReal()&&e.status!=='RUNNING'?'示例':e.status,e.status==='FAIL'?'amber':e.status==='ERROR'?'red':'blue')}</div>`).join('')}</section>${D.critique?`<section class="view-panel"><div class="view-title"><div><h2>独立 LLM 审查</h2><p>isis-critic 按编排技能要求复核本次报告与证据；与配置模型诊断区分。</p></div>${badge(D.critique.overall||'已审查','green')}</div>${file('critique.md','审查原文')}${file('critique.json','结构化审查与文件哈希')}</section>`:''}`}
function reportView(){return `<div class="view-title"><div><h2>项目生成的诊断报告</h2><p>关联运行 ${esc(D.run_id)} · 文件从项目 output/reports 读取</p></div><button class="btn primary" data-download="diagnosis-report.md">下载报告 ↓</button></div><section class="view-panel"><div class="model-label ${currentModelReal()?'real':''}">${currentModelReal()?'报告包含配置模型的真实返回。':'报告中的模型章节为明确标注的解读示例；规则、特征、知识查询与执行追踪为项目实际运行结果。'} 建议调整未执行，恢复未验证。</div><div class="md">${md(asset('diagnosis-report.md').content)}</div><div class="buttons" style="margin-top:20px"><button class="btn" data-asset="analysis-trace.json">执行追踪</button><button class="btn" data-asset="critique.md">独立审查</button><button class="btn" data-asset="manifest.json">来源与哈希</button></div></section>`}
function render(){
 const current=document.querySelector('.stage-workspace'),sameStage=current?.querySelector('#current-stage-title')?.textContent===stages()[selected]?.name;
 const scroll=sameStage?document.querySelector('.stage-content')?.scrollTop||0:0;
 const listScroll=document.querySelector('.process-list')?.scrollTop||0,listLeft=document.querySelector('.process-list')?.scrollLeft||0;
 const focused=document.activeElement,focusId=focused?.id,focusStage=focused?.dataset?.stage,focusPhase=focused?.dataset?.phase;
 document.getElementById('app').innerHTML=shell();
 if(view==='overview'){
  document.querySelector('.stage-content').scrollTop=scroll;
  const list=document.querySelector('.process-list');list.scrollTop=listScroll;list.scrollLeft=listLeft;
  const active=list.querySelector('.stage.active');if(active)active.scrollIntoView({block:'nearest',inline:'nearest'});
 }
 const nextFocus=focusId?document.getElementById(focusId):focusStage!==undefined?document.querySelector(`[data-stage="${focusStage}"]`):focusPhase?document.querySelector(`[data-phase="${focusPhase}"]`):null;
 if(nextFocus&&!nextFocus.disabled)nextFocus.focus({preventScroll:true});
}
function modal(title,subtitle,body,foot=''){lastFocus=document.activeElement;document.getElementById('modal-title').textContent=title;document.getElementById('modal-subtitle').textContent=subtitle;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal-foot').innerHTML=foot;document.getElementById('modal-wrap').hidden=false;document.body.style.overflow='hidden';document.getElementById('close').focus()}
function closeModal(){document.getElementById('modal-wrap').hidden=true;document.body.style.overflow='';lastFocus?.focus()}
function showAsset(id){const a=asset(id);if(!a){toast('当前任务未包含该文件');return}const body=a.binary?`<p class="note" style="margin-top:0">原始 PCAP 包含 ${D.packets.length} 条报文，使用标准 IEEE 802.3 / LLC 封装。下载后可用抓包工具核对。</p><div class="table" style="margin-top:16px"><table><thead><tr><th>帧号</th><th>相对时间</th><th>窗口</th><th>源节点</th><th>类型</th></tr></thead><tbody>${D.packets.filter(p=>p.source_id===sid('R02')).map(p=>`<tr><td>${p.frame}</td><td>T+${p.relative_s}s</td><td>${p.stage==='before'?'基线':'异常'}</td><td>R02</td><td>${p.pdu_type_name}</td></tr>`).join('')}</tbody></table></div>`:a.name.endsWith('.md')?`<div class="md">${md(a.content)}</div>`:`<pre class="raw">${esc(a.content)}</pre>`;modal(a.name,a.path+' · '+kb(a.size),body,`<span>SHA-256 · ${a.sha256}</span><button class="btn primary" data-download="${id}">下载原件 ↓</button>`)}
function download(id){const a=asset(id);if(!a)return;const bytes=a.binary?Uint8Array.from(atob(a.content),c=>c.charCodeAt(0)):a.content;const url=URL.createObjectURL(new Blob([bytes],{type:a.binary?'application/vnd.tcpdump.pcap':'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=a.name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.hidden=false;setTimeout(()=>el.hidden=true,3000)}
function stop(){playing=false;clearTimeout(timer);timer=null}
function tick(){if(!playing)return;if(reveal>=stages().length-1){stop();render();return}timer=setTimeout(()=>{reveal++;selected=reveal;render();tick()},2600/speed)}
async function refresh(){if(location.protocol==='file:'){toast('离线快照已加载；更新分析后重新生成即可');return}try{const response=await fetch('/api/workbench',{cache:'no-store'});if(!response.ok)throw Error('服务未提供任务');const next=await response.json();if(!next.run_id)throw Error('无任务记录');stop();D=next;selected=reveal=stages().length-1;render();document.getElementById('live-status').textContent='已从项目服务读取任务 '+D.run_id;toast('已读取项目保存的任务')}catch(e){toast('保留已保存任务：'+e.message)}}
document.addEventListener('click',e=>{
 const el=e.target.closest('button');if(el){if(el.dataset.view){stop();view=el.dataset.view;render();window.scrollTo({top:0,behavior:'smooth'})}
 else if(el.dataset.stage!==undefined){stop();selected=reveal=Number(el.dataset.stage);render()}
 else if(el.dataset.phase){phase=el.dataset.phase;render()}
 else if(el.id==='previous-stage'||el.id==='next-stage'){stop();selected=reveal=Math.max(0,Math.min(stages().length-1,selected+(el.id==='next-stage'?1:-1)));render()}
 else if(el.id==='stage-details'){const content=document.createElement('div');content.innerHTML=inspector(stages()[selected]);modal(stages()[selected].name,'本环节的输入、输出和执行产物',content.querySelector('.inspector-body').innerHTML)}
 else if(el.dataset.skill){stop();view='skills';skill=el.dataset.skill;render()}
 else if(el.dataset.asset)showAsset(el.dataset.asset);
 else if(el.dataset.download)download(el.dataset.download);
 else if(el.id==='replay'){if(playing){stop();render()}else{if(reveal===stages().length-1)selected=reveal=0;playing=true;render();tick()}}
 else if(el.id==='complete'){stop();selected=reveal=stages().length-1;render()}
 else if(el.id==='refresh')refresh();else if(el.id==='close')closeModal();return}
 const row=e.target.closest('[data-packet]');if(row){const p=D.packets.find(x=>x.frame===Number(row.dataset.packet));modal('报文 #'+p.frame,'T+'+p.relative_s+'s · '+p.stage,`<pre class="raw">${esc(JSON.stringify(p,null,2))}</pre>`,file('link-observation.pcap','查看完整抓包'))}
 if(e.target.id==='modal-wrap')closeModal();
});
// Match reading progress so both columns reach their beginning and end together.
document.addEventListener('scroll',e=>{
 const source=e.target;
 if(!(source instanceof HTMLElement)||!source.matches('.model-column-body')||matchMedia('(max-width:1050px)').matches)return;
 const extent=source.scrollHeight-source.clientHeight;
 if(extent<=0)return;
 const progress=source.scrollTop/extent;
 for(const peer of source.closest('.model-comparison').querySelectorAll('.model-column-body')){
  if(peer===source)continue;
  const top=progress*Math.max(0,peer.scrollHeight-peer.clientHeight);
  if(Math.abs(peer.scrollTop-top)>1)peer.scrollTop=top;
 }
},true);
document.addEventListener('change',e=>{const el=e.target;if(el.id==='speed'){speed=Number(el.value);if(playing){clearTimeout(timer);tick()}}else if(el.id==='packet-stage'){filterStage=el.value;render()}else if(el.id==='packet-kind'){filterKind=el.value;render()}else if(el.id==='packet-node'){filterNode=el.value;render()}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='progress'){stop();selected=reveal=Number(el.value);render()}else if(el.id==='packet-search'){const position=el.selectionStart;search=el.value;render();const next=document.getElementById('packet-search');next.focus();next.setSelectionRange(position,position)}});
document.addEventListener('keydown',e=>{if(document.getElementById('modal-wrap').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const focusables=[...document.getElementById('modal-wrap').querySelectorAll('button,a,input,select,summary')].filter(x=>!x.disabled);if(!focusables.length)return;const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
render();
if(location.pathname==='/workbench'||location.pathname==='/workbench.html')refresh();
</script>
</body></html>
