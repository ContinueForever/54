# Microsoft GraphRAG 2.7.2 settings for agent-analysis project
# Place at /home/hermes/workspace/graphrag/config/settings.yaml
encoding_model: cl100k_base

models:
  default_chat_model:
    type: chat
    model_provider: openai
    auth_type: api_key
    api_key: ${KIMI_API_KEY}
    model: kimi-k3
    api_base: https://api.kimi.com/coding/v1
    encoding_model: ""
    model_supports_json: true
    request_timeout: 180
    tokens_per_minute: 100000
    requests_per_minute: 60
    rate_limit_strategy: static
    retry_strategy: exponential_backoff
    max_retries: 3
    max_retry_wait: 10
    concurrent_requests: 2
    async_mode: threaded
    temperature: 1.0
    top_p: 0.95
    n: 1
    frequency_penalty: 0.0
    presence_penalty: 0.0

  default_embedding_model:
    type: local_tfidf
    model_provider: local_tfidf
    auth_type: api_key
    api_key: local
    model: local_tfidf
    encoding_model: cl100k_base
    request_timeout: 180
    rate_limit_strategy: static
    retry_strategy: none
    max_retries: 10
    max_retry_wait: 10
    concurrent_requests: 10
    async_mode: threaded
    temperature: 0
    top_p: 1
    n: 1
    frequency_penalty: 0.0
    presence_penalty: 0.0

vector_store:
  default_vector_store:
    type: lancedb
    db_uri: /home/hermes/workspace/graphrag/output/lancedb
    url: null
    overwrite: true
    embeddings_schema: {}

input:
  storage:
    type: file
    base_dir: /home/hermes/workspace/graphrag/input
  file_type: text
  encoding: utf-8
  file_pattern: ".*\\.txt$$"

output:
  type: file
  base_dir: /home/hermes/workspace/graphrag/output

update_index_output:
  type: file
  base_dir: /home/hermes/workspace/graphrag/update_output

cache:
  type: file
  base_dir: cache

reporting:
  type: file
  base_dir: /home/hermes/workspace/graphrag/logs

chunks:
  size: 1200
  overlap: 100
  group_by_columns:
    - id
  strategy: tokens
  encoding_model: cl100k_base
  prepend_metadata: false
  chunk_size_includes_metadata: false

embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store
  batch_size: 16
  batch_max_tokens: 8191
  names:
    - entity.description
    - community.full_content
    - text_unit.text
  strategy: null

extract_graph:
  model_id: default_chat_model
  prompt: prompts/extract_graph.txt
  entity_types:
    - fault
    - device
    - state
    - symptom
    - protocol
  max_gleanings: 1
  strategy: null

summarize_descriptions:
  model_id: default_chat_model
  prompt: prompts/summarize_descriptions.txt
  max_length: 500
  max_input_tokens: 4000
  strategy: null

extract_claims:
  enabled: false
  model_id: default_chat_model
  prompt: prompts/extract_claims.txt
  max_gleanings: 1
  strategy: null

community_reports:
  model_id: default_chat_model
  graph_prompt: prompts/community_report_graph.txt
  text_prompt: prompts/community_report_text.txt
  max_length: 2000
  max_input_length: 8000
  strategy: null

prune_graph:
  min_node_freq: 2
  max_node_freq_std: null
  min_node_degree: 1
  max_node_degree_std: null
  min_edge_weight_pct: 40.0
  remove_ego_nodes: true
  lcc_only: false

cluster_graph:
  max_cluster_size: 10
  use_lcc: true
  seed: 3735928559

embed_graph:
  enabled: false

node2vec:
  enabled: false

umap:
  enabled: false

snapshots:
  embeddings: false
  graphml: false
  raw_graph: false

local_search:
  prompt: prompts/local_search_system_prompt.txt
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  text_unit_prop: 0.5
  community_prop: 0.15
  conversation_history_max_turns: 5
  top_k_entities: 10
  top_k_relationships: 10
  max_context_tokens: 12000

global_search:
  map_prompt: prompts/global_search_map_system_prompt.txt
  reduce_prompt: prompts/global_search_reduce_system_prompt.txt
  chat_model_id: default_chat_model
  knowledge_prompt: prompts/global_search_knowledge_system_prompt.txt
  max_context_tokens: 12000
  data_max_tokens: 12000
  map_max_length: 1000
  reduce_max_length: 2000
  dynamic_search_threshold: 1
  dynamic_search_keep_parent: false
  dynamic_search_num_repeats: 1
  dynamic_search_use_summary: false
  dynamic_search_max_level: 2

drift_search:
  prompt: prompts/drift_search_system_prompt.txt
  reduce_prompt: prompts/drift_reduce_prompt.txt
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  data_max_tokens: 12000
  reduce_temperature: 0
  concurrency: 32
  drift_k_followups: 20
  primer_folds: 5
  primer_llm_max_tokens: 12000
  n_depth: 3
  local_search_text_unit_prop: 0.9
  local_search_community_prop: 0.1
  local_search_top_k_mapped_entities: 10
  local_search_top_k_relationships: 10
  local_search_max_data_tokens: 12000
  local_search_temperature: 0
  local_search_top_p: 1
  local_search_n: 1

basic_search:
  prompt: prompts/basic_search_system_prompt.txt
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  k: 10
  max_context_tokens: 12000
