/* Keep replay navigation and the selected stage in one viewport. */
.shell.replay-mode{height:100dvh;min-height:0;overflow:hidden}
.replay-mode .main{height:100dvh;min-height:0;display:flex;flex-direction:column;padding-bottom:12px;overflow:hidden}
.replay-mode .topbar{height:54px;flex-shrink:0}
.replay-mode .hero{padding:14px 0 12px;flex-shrink:0}
.replay-mode .hero p{margin-top:3px}.replay-mode .hero-meta{margin-top:7px}
.replay-mode .provenance{margin-bottom:10px;flex-shrink:0;padding-top:7px;padding-bottom:7px}
.replay-mode #view{display:flex;flex-direction:column;flex:1;min-height:0}
.replay-mode .metrics{flex-shrink:0;margin-bottom:10px}.replay-mode .metric{padding:9px 14px}
.replay-mode .layout{flex:1;min-height:0;grid-template-rows:minmax(0,1fr);align-items:stretch}
.replay-mode .process{display:flex;flex-direction:column;min-height:0}
.replay-mode .process .head,.replay-mode .replay-controls,.replay-mode .process-note{flex-shrink:0}
.replay-mode .process-list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.replay-mode .stage{padding-top:5px;padding-bottom:5px}
.replay-mode .process .head{padding:12px 13px}.replay-mode .process .head p{display:none}
.replay-mode .process-list{padding:8px;gap:1px}.replay-mode .stage-text small{margin-top:1px}
.replay-mode .replay-controls{display:grid;grid-template-columns:1fr auto;padding:9px 10px;gap:7px}
.replay-mode .replay-controls #replay{grid-column:1;grid-row:1}.replay-mode .replay-controls #complete{grid-column:2;grid-row:1}
.replay-mode .replay-controls input{grid-column:1;grid-row:2;min-width:0;margin:0;align-self:center}.replay-mode .replay-controls select{grid-column:2;grid-row:2}
.replay-mode .process-note{display:none}
.replay-mode .process-note{padding:8px 13px}
.stage-workspace{min-width:0;min-height:0;display:flex;flex-direction:column}
.workspace-head{flex-shrink:0;border-bottom:1px solid var(--line);padding:16px 18px}
.workspace-head .eyebrow{font-size:9px;margin-bottom:5px}.workspace-head h2{font-size:17px}
.stage-content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:18px;scrollbar-gutter:stable}
.stage-content:focus-visible{outline:2px solid #97baf5;outline-offset:-3px}
.stage-content h3{font-size:13px;color:#46637f;margin-bottom:10px}.stage-content .section-gap{margin-top:20px}
.stage-content .asset-grid{grid-template-columns:1fr}.stage-content .file{margin-top:10px}
.stage-content .rule{align-items:flex-start}.stage-content .rule>div:nth-child(2){min-width:0;overflow-wrap:anywhere}
.stage-content .network{height:190px}.stage-content .facts{margin-top:16px}
.stage-content .intro{font-size:11px;line-height:1.9;color:#7b91a7;margin-bottom:14px}
.step-navigation{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid var(--line);background:#fafcfe}
.step-navigation span{font-size:10px;color:#8b9db2}.mobile-detail{display:none}

@media(max-width:760px){
.shell.replay-mode{display:flex;flex-direction:column}.replay-mode .sidebar{flex-shrink:0;padding:9px 14px}.replay-mode .brand{display:none}.replay-mode .main{height:auto;flex:1;min-height:0;padding-bottom:8px}.replay-mode .topbar{height:44px}.replay-mode .topbar .buttons{gap:5px}.replay-mode .topbar .btn{font-size:9px;padding:6px 7px}
.replay-mode .hero{padding:9px 0}.replay-mode h1{font-size:16px}.replay-mode .hero .eyebrow,.replay-mode .hero p,.replay-mode .hero-meta,.replay-mode .provenance,.replay-mode .metrics,.replay-mode .source-foot,.replay-mode .trace-foot{display:none}
.replay-mode .layout{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:9px}.replay-mode .process{grid-row:1;grid-column:1}.replay-mode .process .head,.replay-mode .process-note{display:none}.replay-mode .process-list{flex:none;padding:7px;gap:5px;overflow:auto;scrollbar-gutter:auto}.replay-mode .stage{min-width:116px;max-width:116px;padding:7px}.replay-mode .stage .number{display:none}.replay-mode .stage-state{display:none}.replay-mode .stage-text small{font-size:7px}.replay-mode .replay-controls{display:flex;padding:7px 10px;gap:6px}.replay-mode .replay-controls input{width:70px;flex:1;min-width:40px}.replay-mode .inspector{display:none}.mobile-detail{display:inline-flex}
.stage-workspace{grid-row:2;grid-column:1}.workspace-head{padding:11px 13px}.workspace-head h2{font-size:15px}.workspace-head .eyebrow{font-size:8px}.stage-content{padding:13px}.step-navigation{padding:9px 13px}.step-navigation .btn{padding:7px 9px}.stage-content .mini-grid{grid-template-columns:1fr;gap:9px}.stage-content .network{height:165px}.workspace-head .buttons{gap:4px}
}

<body>
<div id="app"></div>
<div class="modal-wrap" id="modal-wrap" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><div><h2 id="modal-title"></h2><p id="modal-subtitle"></p></div><button class="close" id="close" aria-label="关闭">×</button></header><div class="modal-body" id="modal-body"></div><footer class="modal-foot" id="modal-foot"></footer></section></div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="application/json" id="workbench-data">__WORKBENCH_DATA__</script>
<script>
let D=JSON.parse(document.getElementById('workbench-data').textContent);
let view='overview',selected=8,reveal=8,phase='fault',playing=false,timer=null,speed=1,skill='isis-analysis',filterStage='all',filterKind='all',filterNode='all',search='',lastFocus=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const asset=id=>D.assets.find(a=>a.id===id),badge=(s,c='')=>`<span class="badge ${c}">${esc(s)}</span>`;
const kb=n=>n<1024?n+' B':(n/1024).toFixed(1)+' KB',millis=n=>n>=1000?(n/1000).toFixed(2)+' s':n.toFixed(2)+' ms';
const panel=(title,sub,body,action='')=>`<section class="card"><header class="head"><div><h2>${title}</h2><p>${sub}</p></div>${action}</header><div class="body">${body}</div></section>`;
const file=(id,label)=>{const a=asset(id);return `<button class="file" data-asset="${id}"><span class="file-icon">${a?.binary?'PCAP':a?.name.split('.').pop().slice(0,4).toUpperCase()||'FILE'}</span><span><b>${esc(label)}</b><small>${a?esc(a.name)+' · '+kb(a.size):''}</small></span><span>›</span></button>`};
const stages=()=>D.result.stage_records;
const sid=node=>D.state.topology.system_ids[node];
const rows=(stage,node)=>D.packets.filter(p=>p.stage===stage&&p.source_id===sid(node));
const types=(stage,node)=>[...new Set(rows(stage,node).map(p=>p.pdu_type_name))].join(' / ');
const snap=stage=>D.state.snapshots.find(x=>x.stage===stage);
const stateNode=(stage,node)=>snap(stage)?.nodes.find(x=>x.node===node);
const stageSkill=id=>id==='knowledge'?'knowledge-bridge':'isis-analysis';
const roleLabel=s=>s==='FAIL'?'规则命中':s==='PASS'?'未命中':s==='ERROR'?'执行失败':'已完成';
const currentModelReal=()=>D.model_mode==='real'&&D.model.success===true;
function md(text){
  // Older run artifacts retain their original text; omit this preamble in the reading view.
  const lines=String(text||'').replace(/^本解读由 Codex 根据本次项目特征、规则、知识和状态快照编写，用于呈现模型环节的作用；未向项目配置的模型接口发送请求。\r?\n?/m,'').split('\n');let out='',list='',code=false;
  const inline=s=>esc(s).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
  for(const raw of lines){if(raw.startsWith('```')){if(list){out+=`</${list}>`;list=''}out+=code?'</pre>':'<pre class="raw">';code=!code;continue}if(code){out+=esc(raw)+'\n';continue}
    const heading=raw.match(/^(#{1,3})\s+(.*)/),li=raw.match(/^\s*(?:[-*]|\d+[.)])\s+(.*)/);
    if(li){if(!list){list='ul';out+='<ul>'}out+='<li>'+inline(li[1])+'</li>';continue}
    if(list){out+=`</${list}>`;list=''}
    if(heading){const n=heading[1].length;out+=`<h${n}>${inline(heading[2])}</h${n}>`}else if(raw.trim())out+='<p>'+inline(raw)+'</p>';
  }if(list)out+=`</${list}>`;if(code)out+='</pre>';return out;
}
function shell(){const modelNote=currentModelReal()?'模型真实返回已归档':D.model_mode==='illustrative'?'模型环节为证据解读示例':'模型调用未成功';return `<div class="shell ${view==='overview'?'replay-mode':''}"><aside class="sidebar"><div class="brand"><svg viewBox="0 0 34 34" fill="none"><rect x="1" y="1" width="32" height="32" rx="8" stroke="#85a7ca"/><path d="M8 24V15l9-5 9 5v9M8 15l9 5 9-5M17 20v8" stroke="#9fc6f1" stroke-width="1.3"/></svg><div><b>IS-IS 智能分析</b><small>DIAGNOSTIC WORKSPACE</small></div></div><div class="caption">任务工作台</div><nav class="nav">${[['overview','◈','任务复盘'],['evidence','▤','输入与证据'],['model','✧','模型诊断'],['skills','⌘','Skills 与执行'],['report','▧','诊断报告']].map(([id,icon,label])=>`<button data-view="${id}" class="${view===id?'active':''}"><span class="nav-icon">${icon}</span>${label}</button>`).join('')}</nav><div class="side-case"><small>当前任务</small><b>${esc(D.incident.id)}<br>邻接中断 / 探测无应答</b><p><span class="dot"></span>分析记录已生成<br>${esc(D.run_id)}</p></div><div class="side-foot">规则 + 知识 + 模型辅助<br>证据与结论可逐项追溯</div></aside><main class="main"><header class="topbar"><div class="crumb">诊断任务 <b>／ ${esc(D.incident.id)} ／ ${({overview:'分析过程',evidence:'证据档案',model:'模型辅助',skills:'技能与执行',report:'报告'})[view]}</b></div><div class="buttons"><button class="btn" id="refresh">↻ 刷新任务</button><button class="btn" data-asset="manifest.json">来源记录</button><button class="btn primary" data-download="diagnosis-report.md">导出报告 ↓</button></div></header><section class="hero"><div><div class="eyebrow">INCIDENT / 已完成任务的过程可视化</div><div class="title"><h1>${esc(D.incident.title)}</h1>${badge('合成场景','blue')}</div><p>从原始报障、报文与设备状态，追溯每一步如何形成判断。</p><div class="hero-meta"><span><b>报障</b>${esc(D.incident.reported_at.slice(11,19))}</span><span><b>输入</b>${D.result.input.pcap_files.length} PCAP / ${D.result.input.log_files.length} LOG / ${D.result.input.state_files.length} 状态文件</span><span><b>运行编号</b>${esc(D.run_id)}</span></div></div><div class="completion"><b>✓ 分析记录已完成</b><small>${esc(D.trace.end_time.slice(0,19).replace('T',' '))}<br>恢复验证：未提供</small></div></section><div class="provenance"><span>◉</span><span>页面读取本任务的项目运行产物 · ${modelNote} · 回放控制记录展开，不重新执行诊断</span><button class="btn link" data-asset="generation.json">查看来源 ↗</button></div><div id="view">${({overview:overview,evidence:evidenceView,model:modelView,skills:skillsView,report:reportView})[view]()}</div><div class="source-foot"><span>输入为受控合成场景 · 规则 / 知识 / 追踪来自项目实际执行 · 恢复未验证</span><span id="live-status">${esc(D.view_mode)} · ${esc(D.built_at.slice(0,19).replace('T',' '))}</span></div></main></div>`}
function process(){return `<section class="card process"><header class="head"><div><h2>诊断执行链</h2><p>按本次实际流水线展开</p></div>${badge(stages().length+' 阶段','blue')}</header><div class="process-list">${stages().map((s,i)=>`<button class="stage ${i===selected?'active':''} ${i<=reveal?'seen':''} ${s.status==='FAIL'?'hit':''}" data-stage="${i}" aria-pressed="${i===selected}"><span class="number">${i<=reveal?(s.status==='FAIL'?'!':'✓'):String(i+1).padStart(2,'0')}</span><span class="stage-text"><b>${esc(s.name)}</b><small>${stageSkill(s.id)}</small></span><span class="stage-state">${i>reveal?'待展开':s.id==='llm'&&!currentModelReal()?'示例':roleLabel(s.status)}</span></button>`).join('')}</div><div class="replay-controls"><button class="btn primary" id="replay">${playing?'Ⅱ 暂停复盘':'▷ 从报障复盘'}</button><button class="btn" id="complete">完整结果</button><select id="speed" aria-label="复盘速度"><option value="0.6" ${speed===.6?'selected':''}>慢速</option><option value="1" ${speed===1?'selected':''}>正常</option><option value="1.8" ${speed===1.8?'selected':''}>快速</option></select><input id="progress" type="range" min="0" max="${stages().length-1}" value="${reveal}" aria-label="分析步骤"></div><div class="process-note">flow-tracer 全程记录<br>显示节奏不等于实际执行耗时</div></section>`}
function network(){const visible=reveal>=1,s=visible?phase:'before',nodes=['R01','R02'],bad=visible&&s==='fault';
const checkIndex=stages().findIndex(step=>step.id==='L2');
const ruleChecked=checkIndex>=0&&reveal>=checkIndex&&D.result.anomalies.some(a=>a.layer==='L2'&&a.rule.name==='circuit_type_mismatch');
const linkLabel=!visible?'等待提取报文':!bad?'正常观测窗口':ruleChecked?'规则：层级不兼容':'Hello 类型不同';
const color=bad?'#c99445':'#64a693';return `<div class="network"><svg viewBox="0 0 500 210" role="img" aria-label="来自输入状态的R01和R02观测链路"><path d="M150 95H345" stroke="${visible?color:'#becfe2'}" stroke-width="2" ${bad?'stroke-dasharray="5 4"':''}/><rect x="197" y="80" width="108" height="24" rx="12" fill="${bad?'#fff2dd':'#edf5f2'}"/><text x="251" y="96" font-size="10" fill="${color}" text-anchor="middle">${linkLabel}</text>${nodes.map((n,i)=>{const x=i?375:120;return `<rect x="${x-38}" y="66" width="76" height="57" rx="10" fill="${i&&bad?'#fff8ed':'#fff'}" stroke="${i&&bad?color:'#c2d4e8'}"/><path d="M${x-23} 80h15v14h-15zM${x-20} 84h9M${x-20} 89h5" fill="none" stroke="#90a9c6"/><text x="${x+14}" y="94" font-size="12" text-anchor="middle" fill="#527492">${n}</text><text x="${x}" y="141" text-anchor="middle" font-size="10" fill="${i&&bad?color:'#829ab5'}">${visible?esc(types(s,n)):'字段尚未展开'}</text><text x="${x}" y="160" text-anchor="middle" font-size="8" fill="#a0b1c4">Gig0/0/0</text>`}).join('')}<path d="M375 174v15H250" fill="none" stroke="#c7d7e8"/><text x="250" y="204" text-anchor="middle" font-size="9" fill="#91a6bf">业务环回地址 ${esc(D.state.topology.service_target)} · ${visible?(bad?'探测未见应答':'探测有应答'):'待核对探测'}</text></svg></div>`}
function observationContent(){return `<div class="observation"><span class="time-tag">${esc(D.incident.reported_at)} · ${esc(D.incident.id)}</span><b>${esc(D.incident.description)}</b><p>期望：邻接稳定、业务环回地址可达。观测：邻接中断，探测连续无应答。</p></div><div class="buttons" style="margin-top:12px"><button class="btn link" data-asset="device-events.log">原始日志 ↗</button><button class="btn link" data-asset="incident.json">报障记录 ↗</button></div><h3 class="section-gap">本次接收的输入</h3>${file('link-observation.pcap','原始抓包')}${file('device-events.log','设备日志')}${file('network-state.json','设备状态与配置')}<div class="note">从故障现象开始，下一步提取报文与日志证据。</div>`}
function measuredContent(){const snapshot=snap(phase),probe=D.packet_features.icmp[phase]||{};return `<div class="buttons" style="justify-content:space-between"><h3 style="margin:0">协议与链路观测</h3><div class="switch">${[['before','正常基线'],['fault','异常窗口']].map(([id,l])=>`<button data-phase="${id}" aria-pressed="${phase===id}" class="${phase===id?'active':''}">${l}</button>`).join('')}</div></div>${network()}<div class="mini-grid"><div><label>接口物理状态</label><strong>${esc(snapshot.nodes.map(n=>n.node+': '+n.physical_state).join(' / '))}</strong><p>有限快照，未作全时段证明</p></div><div><label>业务探测</label><strong>${probe.req||0} 请求 / ${probe.reply||0} 应答</strong><p>请求与应答计数来自抓包</p></div><div><label>邻接状态</label><strong>${esc(snapshot.nodes.map(n=>n.node+': '+n.adjacency).join(' / '))}</strong><p>来自设备状态快照</p></div></div><div class="note">抓包时间轴与诊断执行时间轴分别展示。此输入没有修复后窗口。</div>`}
function evidenceFacts(){return `<h3 class="section-gap">证据如何连接</h3><div class="facts"><div class="fact"><small>PACKET / 原始报文</small><b>R02 Hello 类型发生变化</b><p>${esc(types('before','R02'))} → ${esc(types('fault','R02'))}；R01 在两个窗口均为 ${esc(types('fault','R01'))}。</p><button class="btn link" data-asset="packet-features.json">核对字段 ↗</button></div><div class="fact"><small>STATE / 状态与配置</small><b>R02 配置与报文一致</b><p>R02 有效层级 ${esc(stateNode('before','R02').process_is_type)} → ${esc(stateNode('fault','R02').process_is_type)}。</p><button class="btn link" data-asset="network-state.json">配置快照 ↗</button></div><div class="fact"><small>LOG / 故障现象</small><b>邻接中断，探测无应答</b><p>日志记录配置提交与邻接变化，抓包独立提供探测应答计数。</p><button class="btn link" data-asset="device-events.log">事件原文 ↗</button></div></div>`}
function outcomeContent(){return `<div class="outcome"><h3>${esc(D.summary.title)}</h3><p>${esc(D.summary.basis)}邻接中断与探测无应答是关联表现；${D.result.anomalies.length} 条命中不能直接计作 ${D.result.anomalies.length} 个独立故障。</p></div><div class="note amber">${currentModelReal()?'模型真实返回已记录。':'本任务的模型解读为示例；未调用配置模型。'} 建议处置尚未执行，恢复未验证。</div>`}
function stageContent(stage){
 if(stage.id==='load')return observationContent();
 if(stage.id==='feature')return measuredContent()+evidenceFacts();
 if(stage.id==='knowledge')return `<p class="intro">根据日志事件和报文信号查询已准备的 CSV 图谱，供后续模型解释原因、影响和排查方法。</p><div class="note" style="margin-top:0">实际查询：${D.knowledge.queries.map(esc).join('、')}。返回 ${D.knowledge.hits.length} 个节点。知识查询结果不参与规则命中判断。</div><h3 class="section-gap">查询返回的知识节点</h3>${D.knowledge.hits.map(n=>`<div class="rule"><div class="rule-icon">KG</div><div><b>${esc(n.name)}</b><p>${esc(n.description)}</p></div></div>`).join('')}${file('knowledge-query.json','查询词与完整返回')}`;
 if(['L1','L2','L3','L4'].includes(stage.id)){const matches=D.result.anomalies.filter(a=>a.layer===stage.id);return `<p class="intro">本步使用已提取的日志事件和报文信号匹配${esc(stage.name)}规则。</p><div class="observation"><b>${esc(stage.detail)}</b><p>PASS 表示未命中现有规则，不代表全面健康证明。</p></div>${matches.map(a=>`<div class="rule"><div class="rule-icon">${esc(a.layer)}</div><div><b>${esc(a.rule.id)} · ${esc(a.rule.description)}</b><p>${esc(a.rule.suggestion)}</p></div>${badge('命中','amber')}</div>`).join('')}${stage.id==='L1'?'<div class="note">已观测接口 UP、错误计数未增长；有限采样不能排除所有物理问题。</div>':stage.id==='L3'?'<div class="note">L3-R004 与链路层同名故障属于同一候选模式，多层命中不等于多个独立根因。</div>':stage.id==='L4'?'<div class="note">探测退化属于已观测的业务影响，需要结合协议和配置证据分析根因。</div>':''}<h3 class="section-gap">本步关联的观测</h3>${measuredContent()}${file('source-rules.json','核对规则材料')}`}
 if(stage.id==='llm')return outcomeContent()+`<h3 class="section-gap">综合诊断与候选比较</h3><div class="md">${md(asset('model-response.md')?.content||'配置模型尚未返回可用结果。')}</div><div class="buttons section-gap"><button class="btn" data-asset="model-call.json">完整输入与来源</button><button class="btn" data-view="model">查看模型诊断</button></div>`;
 return outcomeContent()+`<h3 class="section-gap">诊断产物</h3>${file('diagnosis-report.md','项目生成的诊断报告')}${file('analysis-trace.json','完整执行追踪')}${file('critique.md','独立审查')}<div class="buttons section-gap"><button class="btn primary" data-view="report">阅读完整报告</button><button class="btn" data-download="diagnosis-report.md">导出报告 ↓</button></div>`;
}
function inspector(s){const entry={
 load:['原始报障、PCAP、日志和设备状态。','识别输入文件并交给特征提取。',[['link-observation.pcap','原始抓包'],['device-events.log','原始日志'],['network-state.json','设备状态与配置']]],
 feature:['报文内容、全部日志、设备状态快照。','得到 Hello 类型变化、探测应答退化和事件特征。',[['features.json','实际提取特征'],['packets.json','逐条解码']]],
 knowledge:['日志事件、报文信号和已准备知识表。',`加载 ${D.knowledge.stats.total_nodes} 个节点、${D.knowledge.stats.total_edges} 条关系；返回 ${D.knowledge.hits.length} 个节点。`,[['knowledge-query.json','查询词与实际返回'],['knowledge-validation.md','分析前知识校验']]],
 L1:['物理层规则及当前已提取的特征。','未命中本层规则；结合 UP 和计数快照降低完整物理断链的优先级。',[['network-state.json','物理接口观测'],['analysis-trace.json','原始检查事件']]],
 L2:['邻接事件、Hello 类型、认证、定时器和链路层规则。','邻接异常与层级变化分别触发规则。',[['source-rules.json','链路层规则'],['features.json','匹配的协议信号']]],
 L3:['路由层规则及协议字段。','层级不兼容再次命中；与链路层同名模式归并。',[['analysis-result.json','实际命中规则'],['network-state.json','路由和配置快照']]],
 L4:['端到端探测计数与应用层规则。','探测退化触发业务连通性规则；作为关联影响分析。',[['packet-features.json','请求与应答计数'],['analysis-result.json','应用层命中']]],
 llm:['原始日志、协议统计、配置、命中规则及知识引用。',currentModelReal()?'配置模型返回综合判断、候选比较和处置建议。':'按相同提示和证据生成示例解读；配置模型未调用。',[['model-call.json','完整模型输入与来源'],['model-response.md','证据解读输出']]],
 report:['特征、知识、规则与模型辅助内容。','项目引擎保存报告和追踪；独立审查核对证据边界。',[['diagnosis-report.md','实际生成的报告'],['critique.md','独立 LLM 审查'],['skill-audit.json','技能应用记录']]]
 }[s.id]||['输入','输出',[]];return `<aside class="card inspector"><div class="inspector-head"><div class="eyebrow">STEP ${String(selected+1).padStart(2,'0')} / 执行详情</div>${badge(s.id==='llm'&&!currentModelReal()?'示例解读':roleLabel(s.status),s.status==='FAIL'?'amber':'blue')}<h2>${esc(s.name)}</h2><button class="skill-pill" data-skill="${stageSkill(s.id)}">${stageSkill(s.id)} ↗</button><div class="duration"><span>${esc(s.started_at.slice(11,23))}</span><span>${millis(s.duration_ms)}</span></div></div><div class="inspector-body"><div class="inspector-row"><label>输入</label><p>${entry[0]}</p></div><div class="inspector-row"><label>输出</label><p>${entry[1]}</p></div><div class="inspector-row"><label>该技能的作用</label><p>${esc(D.skills[stageSkill(s.id)].role)}</p></div><div class="inspector-row"><label>实际运行记录</label><p>${esc(s.detail)}</p></div><div class="inspector-row"><label>可核对的产物</label>${entry[2].filter(([id])=>asset(id)).map(([id,l])=>file(id,l)).join('')}</div></div></aside>`}
function overview(){const stage=stages()[selected];return `<div class="metrics">${[[D.packets.length,'原始报文','全部逐条解析'],[D.log_features.raw_lines.length,'原始日志','含正常与异常事件'],[D.result.anomalies.length,'规则命中','跨层归因需合并'],[Object.keys(D.rule_groups).length,'候选模式','区别根因与后果']].map(([n,l,s])=>`<div class="metric"><strong>${n}</strong><label>${l}<span>${s}</span></label></div>`).join('')}</div><div class="layout">${process()}<section class="card stage-workspace" aria-labelledby="current-stage-title"><header class="head workspace-head"><div><div class="eyebrow">STEP ${String(selected+1).padStart(2,'0')} / 当前环节</div><h2 id="current-stage-title">${esc(stage.name)}</h2></div><div class="buttons">${badge(stage.id==='llm'&&!currentModelReal()?'示例解读':roleLabel(stage.status),stage.status==='FAIL'?'amber':'blue')}<button class="btn mobile-detail" id="stage-details">执行详情</button></div></header><div class="stage-content" role="region" aria-label="当前环节内容" tabindex="0">${stageContent(stage)}</div><footer class="step-navigation"><button class="btn" id="previous-stage" ${selected===0?'disabled':''}>← 上一步</button><span role="status" aria-live="polite">${selected+1} / ${stages().length} 环节</span><button class="btn" id="next-stage" ${selected===stages().length-1?'disabled':''}>下一步 →</button></footer></section>${inspector(stage)}</div><div class="trace-foot"><span>flow-tracer · ${D.trace.steps.length} 条原始事件 · ${D.trace.errors.length} 个执行错误</span><button class="btn link" data-view="skills">查看完整执行 →</button></div>`}

function evidenceView(){const filtered=D.packets.filter(p=>(filterStage==='all'||p.stage===filterStage)&&(filterKind==='all'||(filterKind==='isis'?p.kind==='isis':p.kind==='ipv4'))&&(filterNode==='all'||p.source_id===sid(filterNode))&&(!search||JSON.stringify(p).toLowerCase().includes(search.toLowerCase())));return `<div class="view-title"><div><h2>输入与原始证据</h2><p>输入来自同一场景生成与准备入口；每个文件可以核对哈希并下载原件。</p></div>${badge('项目输入 3 份','blue')}</div><section class="view-panel"><div class="asset-grid">${[['link-observation.pcap','原始抓包','IEEE 802.3 / LLC 与 ICMP；只有基线和异常'],['device-events.log','设备事件日志','记录故障现象，未写入诊断根因'],['network-state.json','采集状态快照','接口、层级配置、邻接和路由观测']].map(([id,l,p])=>`<div class="asset-tile"><b>${l}</b><p>${p}</p><p class="code">${id} · ${kb(asset(id).size)}</p><div class="buttons"><button class="btn" data-asset="${id}">查看</button><button class="btn" data-download="${id}">下载 ↓</button></div></div>`).join('')}</div></section><section class="view-panel"><div class="view-title"><div><h2>逐条报文解码</h2><p>${filtered.length} / ${D.packets.length} 条 · 点击报文查看解码字段</p></div><button class="btn" data-download="packets.json">导出解码</button></div><div class="filter"><select id="packet-stage" aria-label="时间窗口">${[['all','全部窗口'],['before','正常基线'],['fault','异常窗口']].map(([v,l])=>`<option value="${v}" ${filterStage===v?'selected':''}>${l}</option>`).join('')}</select><select id="packet-kind" aria-label="协议">${[['all','全部协议'],['isis','IS-IS'],['icmp','ICMP']].map(([v,l])=>`<option value="${v}" ${filterKind===v?'selected':''}>${l}</option>`).join('')}</select><select id="packet-node" aria-label="节点">${['all','R01','R02','R03','R04'].map(v=>`<option value="${v}" ${filterNode===v?'selected':''}>${v==='all'?'全部节点':v}</option>`).join('')}</select><input id="packet-search" aria-label="搜索字段" placeholder="搜索 System ID、MAC、Hello 类型…" value="${esc(search)}"></div><div class="table"><table><thead><tr><th>帧号</th><th>相对时间</th><th>窗口</th><th>源 System ID</th><th>报文类型</th><th>Circuit type</th><th>Holding</th><th>长度</th></tr></thead><tbody>${filtered.map(p=>`<tr class="clickable" data-packet="${p.frame}"><td>${p.frame}</td><td>T+${p.relative_s.toFixed(3)}s</td><td>${p.stage==='before'?'基线':'异常'}</td><td class="code">${p.source_id||'—'}</td><td>${p.pdu_type_name||(p.icmp_type===8?'ICMP 请求':'ICMP 应答')}</td><td>${p.circuit_type?'0x'+p.circuit_type.toString(16).padStart(2,'0'):'—'}</td><td>${p.holding_timer?p.holding_timer+'s':'—'}</td><td>${p.size} B</td></tr>`).join('')}</tbody></table></div><div class="note">IS-IS 的 Level 1 / Level 2 是协议运行层级；诊断流水线的 L1 / L2 则分别指物理层 / 链路层。</div></section>`}
function modelView(){const real=currentModelReal();const content=asset('model-response.md')?.content||'配置模型尚未返回可用结果。';return `<div class="view-title"><div><h2>大模型辅助诊断</h2><p>模型综合事实与知识，比较候选原因，区别根因、后果和待验证事项。</p></div>${badge(real?'真实模型返回':D.model_mode==='illustrative'?'证据解读示例':'调用未完成',real?'green':'amber')}</div><div class="model-label ${real?'real':''}">${real?'本次调用使用项目配置的模型接口，完整输入、返回和耗时已保存。':D.model_mode==='illustrative'?'当前解读按项目实际提示与已提取证据编写，用于展示模型环节；未向配置模型接口发送请求。独立 LLM 审查另有真实记录。':'配置模型调用未成功；请查看模型调用记录中的原因。'}</div><section class="view-panel"><div class="model-meta"><div><label>模型 / 来源</label><b>${esc(D.model.model||'未调用')}</b></div><div><label>输入</label><b>协议、日志、状态、规则、知识</b></div><div><label>记录时间</label><b>${esc(D.model.started_at?.slice(11,23)||'—')}</b></div><div><label>${real?'调用耗时':'示例装载耗时'}</label><b>${millis(D.model.duration_ms||0)}</b></div><div><label>参数</label><b>temperature 0.1 / 2048 tokens</b></div></div><div class="model-comparison"><section class="model-column" aria-labelledby="model-evidence-title"><header class="model-column-head"><h3 id="model-evidence-title">模型收到的证据</h3><p>完整项目提示 · ${D.model.prompt?.length||0} 字符</p></header><div class="model-column-body model-evidence" role="region" aria-label="模型输入证据" tabindex="0"><pre class="raw">${esc(D.model.prompt||'暂无')}</pre></div><footer class="model-column-foot"><button class="btn" data-asset="model-call.json">请求与来源记录</button><button class="btn" data-asset="knowledge-query.json">知识上下文</button></footer></section><section class="model-column" aria-labelledby="model-interpretation-title"><header class="model-column-head"><h3 id="model-interpretation-title">综合诊断与候选比较</h3><p class="model-scroll-hint">滚动任一侧，左右同步查看</p></header><div class="model-column-body model-interpretation" role="region" aria-label="模型诊断解读" tabindex="0"><div class="md">${md(content)}</div></div><footer class="model-column-foot"><button class="btn" data-download="model-response.md">导出解读</button></footer></section></div></section>`}
function skillsView(){const def=D.skills[skill];return `<div class="view-title"><div><h2>Skills 与实际执行</h2><p>技能负责不同阶段；点击查看入口、输入输出和对应产物。追踪记录与技能应用记录分别保存。</p></div>${badge('7 类项目技能','blue')}</div><div class="skill-grid">${Object.entries(D.skills).map(([id,s])=>`<button class="skill-card ${skill===id?'active':''}" data-skill="${id}"><span class="skill-pill">${id}</span><h3>${s.name}</h3><p>${esc(s.role)}</p></button>`).join('')}</div><section class="view-panel"><div class="view-title"><div><h2>${def.name} · ${skill}</h2><p>${esc(def.role)}</p></div><button class="btn" data-asset="skill-definitions/${skill}.md">查看 SKILL 定义</button></div><div class="two-cols"><div>${file(def.artifact,'对应执行产物')}${file('skill-audit.json','本任务的技能应用与交接')}</div><div class="note" style="margin-top:0">技能由执行代理按项目 SKILL.md 应用。引擎阶段由对应模块实现；没有把职责标签伪装成独立 skill API 调用。配置模型诊断与独立审查各自标明来源。</div></div></section><section class="view-panel"><div class="view-title"><div><h2>诊断前的知识准备</h2><p>副本实际执行并供本任务加载 · ${D.preparation.before_nodes} → ${D.preparation.after_nodes} 个节点 · 未重建 GraphRAG 索引</p></div><button class="btn" data-asset="preparation.json">执行清单</button></div><div class="progress-audit">${D.preparation.stages.map(s=>`<button class="item" data-asset="${s.artifact.replace('evidence/','')}"><b>${esc(s.skill)}</b><small>${esc(s.id)} · ${s.returncode===0?'成功':'失败'} · ${millis(s.duration_ms)}</small></button>`).join('')}</div><details><summary>知识校验保留的问题与跳过项</summary>${D.validation.filter(v=>['MAJOR','MINOR','SKIP','CRITICAL'].includes(v.level)).map(v=>`<div class="validation-item">${badge(v.level,v.level==='SKIP'?'':'amber')}<div><b>${esc(v.title)}</b><p>${esc(v.evidence)}</p></div></div>`).join('')}</details></section><section class="view-panel"><div class="view-title"><div><h2>flow-tracer 全程事件</h2><p>原始状态 FAIL 表示规则命中；ERROR 表示执行失败。</p></div><button class="btn" data-download="analysis-trace.json">导出追踪</button></div>${D.trace.steps.map(e=>`<div class="event"><span class="seq">${String(e.seq).padStart(2,'0')}</span><span class="time">${esc(e.timestamp)}</span><b>${esc(e.action)}</b><p>${esc(e.detail||'阶段开始')}</p>${badge(e.layer==='llm'&&!currentModelReal()&&e.status!=='RUNNING'?'示例':e.status,e.status==='FAIL'?'amber':e.status==='ERROR'?'red':'blue')}</div>`).join('')}</section>${D.critique?`<section class="view-panel"><div class="view-title"><div><h2>独立 LLM 审查</h2><p>isis-critic 按编排技能要求复核本次报告与证据；与配置模型诊断区分。</p></div>${badge(D.critique.overall||'已审查','green')}</div>${file('critique.md','审查原文')}${file('critique.json','结构化审查与文件哈希')}</section>`:''}`}
function reportView(){return `<div class="view-title"><div><h2>项目生成的诊断报告</h2><p>关联运行 ${esc(D.run_id)} · 文件从项目 output/reports 读取</p></div><button class="btn primary" data-download="diagnosis-report.md">下载报告 ↓</button></div><section class="view-panel"><div class="model-label ${currentModelReal()?'real':''}">${currentModelReal()?'报告包含配置模型的真实返回。':'报告中的模型章节为明确标注的解读示例；规则、特征、知识查询与执行追踪为项目实际运行结果。'} 建议调整未执行，恢复未验证。</div><div class="md">${md(asset('diagnosis-report.md').content)}</div><div class="buttons" style="margin-top:20px"><button class="btn" data-asset="analysis-trace.json">执行追踪</button><button class="btn" data-asset="critique.md">独立审查</button><button class="btn" data-asset="manifest.json">来源与哈希</button></div></section>`}
function render(){
 const current=document.querySelector('.stage-workspace'),sameStage=current?.querySelector('#current-stage-title')?.textContent===stages()[selected]?.name;
 const scroll=sameStage?document.querySelector('.stage-content')?.scrollTop||0:0;
 const listScroll=document.querySelector('.process-list')?.scrollTop||0,listLeft=document.querySelector('.process-list')?.scrollLeft||0;
 const focused=document.activeElement,focusId=focused?.id,focusStage=focused?.dataset?.stage,focusPhase=focused?.dataset?.phase;
 document.getElementById('app').innerHTML=shell();
 if(view==='overview'){
  document.querySelector('.stage-content').scrollTop=scroll;
  const list=document.querySelector('.process-list');list.scrollTop=listScroll;list.scrollLeft=listLeft;
  const active=list.querySelector('.stage.active');if(active)active.scrollIntoView({block:'nearest',inline:'nearest'});
 }
 const nextFocus=focusId?document.getElementById(focusId):focusStage!==undefined?document.querySelector(`[data-stage="${focusStage}"]`):focusPhase?document.querySelector(`[data-phase="${focusPhase}"]`):null;
 if(nextFocus&&!nextFocus.disabled)nextFocus.focus({preventScroll:true});
}
function modal(title,subtitle,body,foot=''){lastFocus=document.activeElement;document.getElementById('modal-title').textContent=title;document.getElementById('modal-subtitle').textContent=subtitle;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal-foot').innerHTML=foot;document.getElementById('modal-wrap').hidden=false;document.body.style.overflow='hidden';document.getElementById('close').focus()}
function closeModal(){document.getElementById('modal-wrap').hidden=true;document.body.style.overflow='';lastFocus?.focus()}
function showAsset(id){const a=asset(id);if(!a){toast('当前任务未包含该文件');return}const body=a.binary?`<p class="note" style="margin-top:0">原始 PCAP 包含 ${D.packets.length} 条报文，使用标准 IEEE 802.3 / LLC 封装。下载后可用抓包工具核对。</p><div class="table" style="margin-top:16px"><table><thead><tr><th>帧号</th><th>相对时间</th><th>窗口</th><th>源节点</th><th>类型</th></tr></thead><tbody>${D.packets.filter(p=>p.source_id===sid('R02')).map(p=>`<tr><td>${p.frame}</td><td>T+${p.relative_s}s</td><td>${p.stage==='before'?'基线':'异常'}</td><td>R02</td><td>${p.pdu_type_name}</td></tr>`).join('')}</tbody></table></div>`:a.name.endsWith('.md')?`<div class="md">${md(a.content)}</div>`:`<pre class="raw">${esc(a.content)}</pre>`;modal(a.name,a.path+' · '+kb(a.size),body,`<span>SHA-256 · ${a.sha256}</span><button class="btn primary" data-download="${id}">下载原件 ↓</button>`)}
function download(id){const a=asset(id);if(!a)return;const bytes=a.binary?Uint8Array.from(atob(a.content),c=>c.charCodeAt(0)):a.content;const url=URL.createObjectURL(new Blob([bytes],{type:a.binary?'application/vnd.tcpdump.pcap':'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=a.name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.hidden=false;setTimeout(()=>el.hidden=true,3000)}
function stop(){playing=false;clearTimeout(timer);timer=null}
function tick(){if(!playing)return;if(reveal>=stages().length-1){stop();render();return}timer=setTimeout(()=>{reveal++;selected=reveal;render();tick()},2600/speed)}
async function refresh(){if(location.protocol==='file:'){toast('离线快照已加载；更新分析后重新生成即可');return}try{const response=await fetch('/api/workbench',{cache:'no-store'});if(!response.ok)throw Error('服务未提供任务');const next=await response.json();if(!next.run_id)throw Error('无任务记录');stop();D=next;selected=reveal=stages().length-1;render();document.getElementById('live-status').textContent='已从项目服务读取任务 '+D.run_id;toast('已读取项目保存的任务')}catch(e){toast('保留已保存任务：'+e.message)}}
document.addEventListener('click',e=>{
 const el=e.target.closest('button');if(el){if(el.dataset.view){stop();view=el.dataset.view;render();window.scrollTo({top:0,behavior:'smooth'})}
 else if(el.dataset.stage!==undefined){stop();selected=reveal=Number(el.dataset.stage);render()}
 else if(el.dataset.phase){phase=el.dataset.phase;render()}
 else if(el.id==='previous-stage'||el.id==='next-stage'){stop();selected=reveal=Math.max(0,Math.min(stages().length-1,selected+(el.id==='next-stage'?1:-1)));render()}
 else if(el.id==='stage-details'){const content=document.createElement('div');content.innerHTML=inspector(stages()[selected]);modal(stages()[selected].name,'本环节的输入、输出和执行产物',content.querySelector('.inspector-body').innerHTML)}
 else if(el.dataset.skill){stop();view='skills';skill=el.dataset.skill;render()}
 else if(el.dataset.asset)showAsset(el.dataset.asset);
 else if(el.dataset.download)download(el.dataset.download);
 else if(el.id==='replay'){if(playing){stop();render()}else{if(reveal===stages().length-1)selected=reveal=0;playing=true;render();tick()}}
 else if(el.id==='complete'){stop();selected=reveal=stages().length-1;render()}
 else if(el.id==='refresh')refresh();else if(el.id==='close')closeModal();return}
 const row=e.target.closest('[data-packet]');if(row){const p=D.packets.find(x=>x.frame===Number(row.dataset.packet));modal('报文 #'+p.frame,'T+'+p.relative_s+'s · '+p.stage,`<pre class="raw">${esc(JSON.stringify(p,null,2))}</pre>`,file('link-observation.pcap','查看完整抓包'))}
 if(e.target.id==='modal-wrap')closeModal();
});
// Match reading progress so both columns reach their beginning and end together.
document.addEventListener('scroll',e=>{
 const source=e.target;
 if(!(source instanceof HTMLElement)||!source.matches('.model-column-body')||matchMedia('(max-width:1050px)').matches)return;
 const extent=source.scrollHeight-source.clientHeight;
 if(extent<=0)return;
 const progress=source.scrollTop/extent;
 for(const peer of source.closest('.model-comparison').querySelectorAll('.model-column-body')){
  if(peer===source)continue;
  const top=progress*Math.max(0,peer.scrollHeight-peer.clientHeight);
  if(Math.abs(peer.scrollTop-top)>1)peer.scrollTop=top;
 }
},true);
document.addEventListener('change',e=>{const el=e.target;if(el.id==='speed'){speed=Number(el.value);if(playing){clearTimeout(timer);tick()}}else if(el.id==='packet-stage'){filterStage=el.value;render()}else if(el.id==='packet-kind'){filterKind=el.value;render()}else if(el.id==='packet-node'){filterNode=el.value;render()}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='progress'){stop();selected=reveal=Number(el.value);render()}else if(el.id==='packet-search'){const position=el.selectionStart;search=el.value;render();const next=document.getElementById('packet-search');next.focus();next.setSelectionRange(position,position)}});
document.addEventListener('keydown',e=>{if(document.getElementById('modal-wrap').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const focusables=[...document.getElementById('modal-wrap').querySelectorAll('button,a,input,select,summary')].filter(x=>!x.disabled);if(!focusables.length)return;const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
render();
if(location.pathname==='/workbench'||location.pathname==='/workbench.html')refresh();
</script>
</body></html>
