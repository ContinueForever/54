勘误\n\n案例：IS-IS 层级配置不匹配。历史分析时间：2026-10-13 20:07:13。\n\n原报告中 L2-R003 与 L3-R004 都指向 circuit_type_mismatch，是同一故障在两个检查层命中。\n演示采用「单个配置故障、跨层规则命中」解读，不采用原报告的「复合故障」结论。\n原报告、追踪文件及其原始结论均未修改，下载区保留原件。\n\n抓包证据：R02 在 before 段发送 L2 LAN IIH，在 fault 段发送 L1 LAN IIH，after 段恢复 L2 LAN IIH。\n日志第二行记录 Circuit type mismatch，与该信号相符。\n日志第一行中的接收方向表述与抓包不完全一致；诊断重点依据抓包字段和第二行日志。\n\n展示的抓包与日志取自项目归档的同场景合成样例；原诊断输入位于已不再保留的临时路径，\n因此这里不宣称归档文件就是该历史运行的逐字节输入。重新解析的字段与原报告列出的信号相符。\n\n「恢复样例」仅表示合成抓包 after 段字段恢复，不是现场设备修复或业务恢复的验证。\n历史诊断关闭了模型调用并使用 CSV 知识查询；本包不演示实时大模型或实时 GraphRAG 查询。\n新增规则知识使用演示副本中的素材提取/合并/构建/校验，未自动变成新的诊断规则。\n技能名称与引擎步骤的对应是职责解释；原 trace 并未记录独立的 skill 调用事件。\n"},{"id":"evidence/knowledge-query.json","name":"knowledge-query.json","path":"evidence/knowledge-query.json","size":728,"sha256":"3aeffa48a9c03c9cad53d78f0c934d99dfee533754b5fd2ac7cdb165d980cb59","binary":false,"content":"{\n  \"query\": \"circuit type mismatch\",\n  \"source\": \"agent-analysis/config/knowledge_tables\",\n  \"queried_at\": \"2026-10-14T10:02:00.319531+08:00\",\n  \"hits\": [\n    {\n      \"node_id\": \"circuit_type_mismatch\",\n      \"node_type\": \"fault\",\n      \"name\": \"Circuit Type Mismatch\",\n      \"description\": \"L1/L2 circuit-type mismatch prevents adjacency formation\",\n      \"source\": \"RFC 1195\"\n    }\n  ],\n  \"related\": [],\n  \"incoming_edges\": [\n    {\n      \"source_id\": \"adjacency_down\",\n      \"relation\": \"caused_by\",\n      \"target_id\": \"circuit_type_mismatch\",\n      \"strength\": \"0.7\",\n      \"description\": \"Circuit type mismatch causes adjacency down\"\n    }\n  ],\n  \"incoming_edge_source\": \"agent-analysis/config/knowledge_tables/edges.csv\"\n}"},{"id":"evidence/knowledge_graph.txt","name":"knowledge_graph.txt","path":"evidence/knowledge_graph.txt","size":26422,"sha256":"bb5ea2de701d45dc22f5d50c263437009550b0c527c936638a05ab77246838af","binary":false,"content":"# RFC1195\n# RFC 1195 - 在 OSI IS-IS 中携带 IP 和 ISO 路由\n\nIS-IS 最初为 ISO CLNP 设计，RFC 1195 扩展了 IS-IS 以支持 IPv4/IPv6 路由，引入以下关键 TLV：\n\n- **TLV 128 (IP Internal Reachability)**：宣告直连 IPv4 前缀。\n- **TLV 129 (Protocols Supported)**：宣告支持的协议族（NLPID = 0xCC 表示 IPv4）。\n- **TLV 130 (IP External Reachability)**：宣告外部引入的 IPv4 路由。\n- **TLV 132 (IP Interface Address)**：宣告接口 IP 地址。\n\n## 诊断相关要点\n\n| 症状 | 可能原因 |\n|------|----------|\n| IP 路由不发布 | 缺少 Protocols Supported TLV 或 NLPID 不匹配 |\n| 外部路由不可达 | IP External Reachability TLV 缺失或 down-bit 置位 |\n| 邻居 UP 但无 IP 路由 | 接口未使能 IS-IS 或地址族未协商 |\n\n\n---\n# RFC3358\n# RFC 3358 - IS-IS 邻接关系与状态机\n\nIS-IS 邻接按如下状态机演进：\n\n```\nDown -\u003e Init -\u003e Up\n```\n\n## 关键状态\n\n- **Down**：未收到任何 IIH 或 Hold Timer 超时。\n- **Init**：收到 IIH，但邻居列表中未看到自己 System ID。\n- **Up**：双向通信确认，邻居列表中包含自己 System ID。\n\n## 影响邻接的常见故障\n\n| 故障类型 | 典型现象 |\n|----------|----------|\n| 区域不匹配 | 收到 IIH 但 Area Address TLV 不一致，邻接无法到达 Up |\n| 认证失败 | IIH 被丢弃，序列中看不到任何邻接状态变更 |\n| Hello 定时器不匹配 | 短期可能不影响邻接，长期导致保活抖动 |\n| Circuit Type 不匹配 | L1/L2 级别不一致，邻接状态停滞 |\n| 重复 System ID | LSP 冲突、多次邻接震荡 |\n| MTU 不匹配 | LSP 分片交互异常，邻接反复 Init |\n| 链路物理 down | 对端停止发送 IIH，本端 Hold Timer 超时后 Down |\n\n## 诊断规则\n\n- 若 fault 段 src_ids 减少且邻接日志出现 adjacency_down，判定为 NEIGHBOR_LOSS_AT_FAULT。\n- 若 fault 段持续收到 IIH 但邻接不 Up，检查 Area、Auth、Circuit Type、MTU。\n- 若出现 duplicate_system_id 标志且多个节点共享同一 System ID，判定为 DUPLICATE_SYSTEM_ID。\n\n\n---\n# RFC5301\n# RFC 5301 - IS-IS 动态主机名\n\n动态主机名映射 System ID 到可读名称，通过 **TLV 137 (Dynamic Hostname)** 携带。\n\n## 诊断价值\n\n- 通过 System ID 反查主机名，便于定位故障节点。\n- 若日志或 pcap 中出现 System ID 冲突，可结合主机名快速定位网元。\n\n## 表格\n\n| System ID | Hostname | Role |\n|-----------|----------|------|\n| 0000.0000.0001 | R01 | 星型中心 |\n| 0000.0000.0002 | R02 | 焦点节点 |\n| 0000.0000.0003 | R03 | 背景节点 |\n| 0000.0000.0004 | R04 | 背景节点 |\n| 0000.0000.0005 | R05 | 背景节点 |\n\n\n---\n## Entity: L1 CSNP (PDU_L1_CSNP)\nType: protocol\nDescription: Complete Sequence Number PDU used for LSDB synchronization on L1 broadcast segments\nSource: RFC 1195\n\n---\n## Entity: L1 LAN IIH (PDU_L1_LAN_IIH)\nType: protocol\nDescription: Level-1 LAN Hello PDU used on L1-only broadcast segments\nSource: RFC 1195\n\n---\n## Entity: L1 LSP (PDU_L1_LSP)\nType: protocol\nDescription: Level-1 Link State PDU carrying area topology information\nSource: RFC 1195\n\n---\n## Entity: L2 CSNP (PDU_L2_CSNP)\nType: protocol\nDescription: Complete Sequence Number PDU used for LSDB synchronization on L2 broadcast segments\nSource: RFC 1195\n\n---\n## Entity: L2 LAN IIH (PDU_L2_LAN_IIH)\nType: protocol\nDescription: Level-2 LAN Hello PDU used to discover and maintain IS-IS neighbors on broadcast segments\nSource: RFC 1195\n\n---\n## Entity: L2 LSP (PDU_L2_LSP)\nType: protocol\nDescription: Level-2 Link State PDU carrying topology and reachability information\nSource: RFC 1195\n\n---\n## Entity: P2P IIH (PDU_P2P_IIH)\nType: protocol\nDescription: Point-to-point Hello PDU used on point-to-point links\nSource: RFC 1195\n\n---\n## Entity: Router R01 (R01)\nType: device\nDescription: Central star router in the simulated topology\nSource: topology\n\n---\n## Entity: Router R02 (R02)\nType: device\nDescription: Fault-peer router on the focal link\nSource: topology\n\n---\n## Entity: Area Address TLV (TLV_AREA_ADDR)\nType: tlv\nDescription: TLV 1 lists area addresses supported by the originating IS\nSource: RFC 1195\n\n---\n## Entity: Authentication TLV (TLV_AUTH)\nType: tlv\nDescription: TLV 10 carries authentication information used to verify IS-IS PDUs\nSource: RFC 1195\n\n---\n## Entity: Extended IP Reachability TLV (TLV_EXT_IP_REACH)\nType: tlv\nDescription: TLV 135 describes IP prefixes with extended metrics\nSource: RFC 5305\n\n---\n## Entity: Extended IS Reachability TLV (TLV_EXT_IS_REACH)\nType: tlv\nDescription: TLV 22 describes IS neighbors with extended metrics\nSource: RFC 5305\n\n---\n## Entity: Dynamic Hostname TLV (TLV_HOSTNAME)\nType: tlv\nDescription: TLV 137 carries human-readable hostname of the router\nSource: RFC 5301\n\n---\n## Entity: IP Interface Address TLV (TLV_IP_ADDR)\nType: tlv\nDescription: TLV 132 lists IPv4 addresses of the originating interface\nSource: RFC 1195\n\n---\n## Entity: Padding TLV (TLV_PADDING)\nType: tlv\nDescription: TLV 8 is used to pad PDUs to desired size for MTU consistency\nSource: RFC 1195\n\n---\n## Entity: Protocols Supported TLV (TLV_PROTOS_SUPPORTED)\nType: tlv\nDescription: TLV 129 lists NLPIDs of network layer protocols supported by the IS\nSource: RFC 1195\n\n---\n## Entity: Adjacency (adjacency)\nType: symptom\nDescription: 规则 adjacency_down 的指标：Adjacency\nSource: rule:layer2_link.json\n\n---\n## Entity: Adjacency Down (adjacency_down)\nType: state\nDescription: IS-IS neighbor adjacency has transitioned to Down state\nSource: RFC3358\nRelationship: adjacency_down --causes--\u003e neighbor_loss. Neighbor adjacency Down leads to neighbor loss symptom\nRelationship: adjacency_down --indicates--\u003e adjacency. adjacency_down indicates Adjacency\nRelationship: adjacency_down --indicates--\u003e down. adjacency_down indicates Down\n\n---\n## Entity: Adjacency Up (adjacency_up)\nType: state\nDescription: IS-IS neighbor adjacency has reached Up state\nSource: RFC3358\n\n---\n## Entity: Area Mismatch (area_mismatch)\nType: fault\nDescription: Area Address TLV does not match between neighbors\nSource: RFC3358\nRelationship: area_mismatch --prevents--\u003e adjacency_up. Area mismatch prevents adjacency from reaching Up\nRelationship: area_mismatch --causes--\u003e adjacency_down. Area Mismatch may cause adjacency Down\nRelationship: area_mismatch --indicates--\u003e 两端区域地址不同. area_mismatch indicates 两端区域地址不同\nRelationship: area_mismatch --indicates--\u003e l1/l2邻接建立失败. area_mismatch indicates L1/L2邻接建立失败\nRelationship: area_mismatch --indicates--\u003e 区域间路由不可达. area_mismatch indicates 区域间路由不可达\n\n---\n## Entity: auth_fail (auth_fail)\nType: symptom\nDescription: 规则 auth_failure 的指标：auth_fail\nSource: rule:layer2_link.json\n\n---\n## Entity: auth_failure (auth_failure)\nType: rule\nDescription: IS-IS认证失败\nSource: rule:layer2_link.json\nRelationship: auth_failure --indicates--\u003e auth_fail. auth_failure indicates auth_fail\nRelationship: auth_failure --indicates--\u003e authentication_failed. auth_failure indicates Authentication failed\n\n---\n## Entity: Authentication Mismatch (auth_mismatch)\nType: fault\nDescription: Authentication TLV missing or checksum invalid\nSource: RFC3358\nRelationship: auth_mismatch --prevents--\u003e adjacency_up. Authentication failure prevents adjacency Up\nRelationship: auth_mismatch --causes--\u003e adjacency_down. Authentication Mismatch may cause adjacency Down\n\n---\n## Entity: Authentication failed (authentication_failed)\nType: symptom\nDescription: 规则 auth_failure 的指标：Authentication failed\nSource: rule:layer2_link.json\n\n---\n## Entity: Baseline (baseline)\nType: fault\nDescription: baseline 对照场景：before / fault / after 均为正常 IIH，标准化异常应为 0。\nSource: scenario\nRelationship: baseline --causes--\u003e adjacency_down. Baseline may cause adjacency Down\n\n---\n## Entity: Circuit Type Mismatch (circuit_type_mismatch)\nType: fault\nDescription: L1/L2 circuit level inconsistent\nSource: RFC3358\nRelationship: circuit_type_mismatch --prevents--\u003e adjacency_up. Circuit level mismatch prevents adjacency Up\nRelationship: circuit_type_mismatch --causes--\u003e adjacency_down. Circuit Type Mismatch may cause adjacency Down\nRelationship: circuit_type_mismatch --indicates--\u003e 一端为l1_only，另一端为l2_only. circuit_type_mismatch indicates 一端为L1-only，另一端为L2-only\nRelationship: circuit_type_mismatch --indicates--\u003e 只能建立单边邻接. circuit_type_mismatch indicates 只能建立单边邻接\nRelationship: circuit_type_mismatch --indicates--\u003e level不匹配导致路由信息丢失. circuit_type_mismatch indicates Level不匹配导致路由信息丢失\n\n---\n## Entity: combo-auth-area (combo_auth_area)\nType: composite_fault\nDescription: 复合故障：auth_mismatch + area_mismatch。表现为两个独立故障在同一故障窗口同时出现，需分别识别各子故障证据，按规则逐项排查。\nSource: combo_lib\nRelationship: combo_auth_area --combines--\u003e auth_mismatch. 复合故障 combo-auth-area 由 auth_mismatch 与另一故障叠加而成\nRelationship: c  const s=STAGES[current];
 $('stage-nav').innerHTML=STAGES.map((item,i)=>`<button class="nav-item ${i===current?'active':''} ${i<current?'visited':''}" data-stage="${i}" ${i===current?'aria-current="step"':''}><span class="nav-num">${String(i+1).padStart(2,'0')}</span><span><span class="nav-title">${item.nav}</span><span class="nav-skill">${item.skill}</span></span></button>`).join('');
 $('eyebrow').textContent=s.eyebrow;$('stage-title').textContent=s.title;$('stage-desc').textContent=s.desc;$('step-number').textContent=String(current+1).padStart(2,'0');$('progress-fill').style.width=((current+1)/7*100)+'%';
 $('main-pane').innerHTML=renderers[current]();$('detail-pane').innerHTML=renderDetail();
 $('prev').disabled=current===0;$('next').disabled=current===6;$('play').textContent=playing?'Ⅱ 暂停播放':'▷ 自动播放';
 $('play-status').textContent=playing?'自动回放中 · 仅切换已保存的证据':'手动回放 · 可点击左侧任一阶段';
}
function stop(){playing=false;clearTimeout(timer);timer=null;$('play').textContent='▷ 自动播放';$('play-status').textContent='手动回放 · 可点击左侧任一阶段';}
function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{if(current>=6){stop();toast('回放完成，可以继续查看证据。');return;}current++;render();schedule();},Number($('speed').value));}
function gotoStage(index){stop();current=Math.min(6,Math.max(0,index));render();}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,2500);}
function showModal(title,subtitle,html,tools=''){stop();lastFocus=document.activeElement;$('modal-title').textContent=title;$('modal-subtitle').textContent=subtitle;$('modal-body').innerHTML=html;$('modal-tools').innerHTML=tools;$('modal-backdrop').hidden=false;document.body.style.overflow='hidden';$('modal-close').focus();}
function closeModal(){$('modal-backdrop').hidden=true;document.body.style.overflow='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}
function showArtifact(id){const a=asset(id);if(!a){toast('这份证据未包含在演示包中。');return;}const body=a.binary?`<div class="help-section"><h3>原始抓包 · ${esc(a.name)}</h3><p>文件包含 ${DATA.packets.length} 个合成报文，未在本次演示中生成或修改。可下载后用抓包工具核对协议字段。</p></div><div class="table-wrap"><table><thead><tr><th>相对时间</th><th>节点 System ID</th><th>Hello 类型</th><th>窗口</th></tr></thead><tbody>${DATA.packets.filter(p=>p.source_id==='000000000002').slice(0,15).map(p=>`<tr><td>T+${p.relative_s}s</td><td class="code">${p.source_id}</td><td>${esc(p.pdu_type_name)}</td><td>${phaseNames[p.stage]}</td></tr>`).join('')}</tbody></table></div><p class="source-date">预览仅列出 R02 的前 15 条报文。完整解码见 packets.json。</p>`:`<pre class="artifact-text">${esc(a.content)}</pre>`;showModal(a.name,a.path+' · '+fmtBytes(a.size),body,`<small>${a.sha256?'SHA-256 · '+esc(a.sha256.slice(0,24))+'…':'演示包资料索引'}</small><button class="button primary" data-download="${id}">下载原始文件 ↓</button>`);}
function download(id){const a=asset(id);if(!a)return;let content=a.content;if(a.binary){const raw=atob(content);content=Uint8Array.from(raw,c=>c.charCodeAt(0));}const blob=new Blob([content],{type:a.binary?'application/octet-stream':'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=a.name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('已导出 '+a.name);}
function showFiles(){showModal('证据档案','本地文件已内嵌，离线打开同样可以查看和下载。',`<div class="asset-list">${DATA.assets.map(a=>`<button class="asset-row" data-artifact="${a.id}"><span><b>${esc(a.name)}</b><small>${esc(a.path)}</small></span><small>${fmtBytes(a.size)} ›</small></button>`).join('')}</div>`,`<small>${DATA.assets.length} 份文件 · 原件、补跑记录与展示解读分别保存</small>`);}
function showHelp(){showModal('建议用 8–10 分钟讲完一次协作','不运行项目后台，不调用模型，不修改原项目数据。',`<div class="help-section"><h3>先说明数据来自哪里</h3><p>这是结果回放：诊断和追踪来自 2026-10-13；知识准备和 CSV 查询于 ${supplementDate} 在本地补跑。抓包与日志是项目归档的同场景合成样例，不能证明现场网络行为。</p></div><div class="help-section"><h3>讲解顺序</h3><ol><li><b>任务编排（1 分钟）：</b>切换正常、异常和恢复样例，介绍 R02 的字段变化与七类技能分工。</li><li><b>素材提取、知识构建（2 分钟）：</b>对照原始规则与候选行，查看 82 → 87 节点和合并前快照。</li><li><b>质量校验（1 分钟）：</b>打开实际问题项，说明严重错误为 0，但来源缺失仍需复核。</li><li><b>知识桥接、分层诊断（3 分钟）：</b>从查询节点走到报文字段、跨层规则与排查建议。</li><li><b>流程追踪（1 分钟）：</b>回看执行步骤，打开原报告与勘误，说明结论边界。</li></ol></div><div class="help-section"><h3>现场操作</h3><p>左侧可直接跳转；底部支持逐步或自动播放。抓包窗口和校验结果可以筛选。键盘左右箭头切换阶段，空格播放或暂停，Esc 关闭弹窗。打开任何证据会暂停自动播放。</p></div><div class="help-section"><h3>需要主动说明的边界</h3><p>原报告把同一故障的两层命中误写成复合故障，本页解读已纠正，原件未改。恢复段只展示合成字段恢复。未使用模型推理、实时 GraphRAG 或持续学习；知识导入不等于诊断规则自动更新。</p></div>`,`<small>建议逐步讲解，自动播放适合简短浏览。</small><button class="button" data-artifact="evidence/interpretation.md">查看完整勘误说明</button>`);}
function togglePlay(){if(playing){stop();return;}if(current===6)current=0;playing=true;render();schedule();}
document.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.dataset.stage!==undefined){gotoStage(Number(target.dataset.stage));return;}if(target.dataset.phase){phase=target.dataset.phase;render();return;}if(target.dataset.filter){filter=target.dataset.filter;render();return;}if(target.dataset.artifact){showArtifact(target.dataset.artifact);return;}if(target.dataset.download){download(target.dataset.download);return;}});
$('prev').onclick=()=>gotoStage(current-1);$('next').onclick=()=>gotoStage(current+1);$('reset').onclick=()=>{phase='fault';filter='all';gotoStage(0);};$('play').onclick=togglePlay;$('speed').onchange=()=>schedule();$('all-files').onclick=showFiles;$('help').onclick=showHelp;$('modal-close').onclick=closeModal;
$('modal-backdrop').addEventListener('click',e=>{if(e.target===$('modal-backdrop'))closeModal();});
document.addEventListener('keydown',event=>{if(!$('modal-backdrop').hidden){if(event.key==='Escape')closeModal();if(event.key==='Tab'){const focusables=[...$('modal-backdrop').querySelectorAll('button,a,input,select,[tabindex="0"]')].filter(el=>!el.disabled);const first=focusables[0],last=focusables[focusables.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}return;}if(['SELECT','INPUT','TEXTAREA','BUTTON','A'].includes(document.activeElement?.tagName))return;if(event.key==='ArrowRight'){event.preventDefault();gotoStage(current+1);}if(event.key==='ArrowLeft'){event.preventDefault();gotoStage(current-1);}if(event.code==='Space'){event.preventDefault();togglePlay();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)stop();});
$('supplement-date').textContent=supplementDate;render();
</script>
</body>
</html>
