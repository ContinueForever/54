 const relevant=DATA.source_rules.rules.find(r=>r.name==='circuit_type_mismatch');

 return card('材料与候选，一行一行对照','EXTRACT / 候选生成',`<div class="material-meta"><span>素材 <b>layer2_link.json</b></span><span>来源 <b>项目已有链路层规则</b></span></div><pre class="source-block">${esc(JSON.stringify(sample,null,2))}</pre><div class="subheading"><h3>提取出的标准候选节点</h3><span>${DATA.candidate_nodes.length} 个节点 · 未直接修改原项目</span></div><div class="table-wrap"><table><thead><tr><th>节点 ID</th><th>名称</th><th>类型</th><th>来源</th></tr></thead><tbody>${DATA.candidate_nodes.map(n=>`<tr><td class="code">${esc(n.node_id)}</td><td class="code">${esc(n.name)}</td><td>${esc(n.node_type)}</td><td>${esc(n.source)}</td></tr>`).join('')}</tbody></table></div><div class="callout">差异报告显示 5 个新增节点，0 个重复节点、0 个冲突节点。旧知识按名称存储，新候选按规则 ID 存储，因此出现知识表示增量，并非新增故障类型。</div>`);
}
function renderBuilder(){return card('同一份知识，交付成一致的产物','BUILD / 合并与重建',`<div class="compare"><div class="compare-box"><small>合并前 · 演示副本</small><strong>${DATA.before_nodes.length}</strong><p>节点 / ${DATA.before_edges.length} 条关系</p></div><span class="compare-arrow">→</span><div class="compare-box after"><small>合并后 · 自动构建并校验</small><strong>${DATA.after_nodes.length}</strong><p>节点 / ${DATA.after_edges.length} 条关系</p></div></div><div class="subheading"><h3>本次新增的规则知识节点</h3><span>保留已有节点与关系</span></div><div class="graph-new">${DATA.new_nodes.map(n=>`<span class="node-chip">${esc(n.node_id)}</span>`).join('')}</div><div class="subheading"><h3>构建交付物</h3><span>均已保存至演示包</span></div><div class="checks"><div class="check-row"><div class="check-icon">✓</div><div><b>CSV ↔ 图谱 JSON</b><p>节点集与关系三元组一致，供后续校验与查询。</p></div></div><div class="check-row"><div class="check-icon">✓</div><div><b>检索输入文本</b><p>图谱节点、描述和关系写入 knowledge_graph.txt。</p></div></div><div class="check-row"><div class="check-icon">✓</div><div><b>合并前快照</b><p>保留首次合并前的表格，用于回滚与前后对照。</p></div></div></div><div class="callout warn">本次没有重建 GraphRAG 索引，也没有修改诊断引擎的规则文件。知识表示的更新与诊断规则的更新是不同操作。</div>`);}
function renderValidator(){
 const selected=DATA.validation.filter(i=>filter==='all'?['MAJOR','MINOR','SKIP'].includes(i.level)||i.level==='PASS'&&['B','E'].includes(i.check):filter==='issues'?['CRITICAL','MAJOR','MINOR'].includes(i.level):i.level==='PASS');
 return card('让问题留在报告里，而不是被隐藏','VALIDATE / 分级校验',`${metrics([['严重错误',COUNTS.CRITICAL,'阻断后续流程'],['通过项',COUNTS.PASS,'结构与一致性检查'],['待复核项',COUNTS.MAJOR+COUNTS.MINOR,'MAJOR / MINOR']])}<div class="pill-tabs" role="group" aria-label="校验结果筛选">${[['all','摘要'],['issues','问题项'],['passed','通过项']].map(([id,label])=>`<button data-filter="${id}" class="${filter===id?'active':''}" aria-pressed="${filter===id}">${label}</button>`).join('')}</div><div class="checks">${selected.slice(0,8).map(i=>`<div class="check-row ${['MAJOR','MINOR','CRITICAL'].includes(i.level)?'warn':i.level==='SKIP'?'skip':''}"><div class="check-icon">${i.level==='PASS'?'✓':i.level==='SKIP'?'–':'!'}</div><div><b>${esc(i.title)}</b><p>${esc(i.evidence.split('\n').slice(0,2).join(' / '))}</p></div><small>${esc(i.check)} · ${esc(i.level)}</small></div>`).join('')||'<p class="empty-notice">没有对应级别的检查项。</p>'}</div><div class="callout warn">RFC 5305 的两处引用仍缺少本地语料；近似名称提示需人工复核。严重错误为 0，只说明本次未发现 CRITICAL，不代表全部知识已经通过语义验证。</div><p class="source-date">完整报告包含 ${DATA.validation.length} 个检查条目；服务一致性检查已跳过。</p>`);
}
function renderBridge(){
 const hit=DATA.knowledge.hits.find(n=>n.node_id==='circuit_type_mismatch')||DATA.knowledge.hits[0];
 const relations=DATA.knowledge.incoming_edges||[];
 return card('从查询词，走到具体知识与关系','QUERY / 本地知识桥接',`<div class="query-box"><span class="search-glyph" aria-hidden="true">⌕</span><span>${esc(DATA.knowledge.query)}</span><span class="badge blue" style="margin-left:auto">CSV 查询</span></div><div class="knowledge-node"><span class="badge gray">${esc(hit.node_type)}</span><h3 style="margin-top:10px">${esc(hit.name)}</h3><div class="code">${esc(hit.node_id)}</div><p>${esc(hit.description)}</p><p style="font-size:10px;margin-top:9px">来源标注：${esc(hit.source)}</p></div><div class="subheading"><h3>节点的关联关系</h3><span>从边表实际读取的入边</span></div>${relations.slice(0,3).map(e=>`<div class="relation"><b>${esc(e.source_id)}</b><span>${esc(e.relation)} →</span><b>${esc(e.target_id)}</b></div>`).join('')||'<div class="empty-notice">关联关系见完整查询结果。</div>'}<div class="callout">节点检索调用了知识适配器；因其关系接口仅返回出边，本页另从边表读取该节点的入边。它们提供诊断参考；报文中的层级差异和规则命中仍是判断的重要依据。</div><div class="next-panel"><strong>交给分析技能：</strong> 两端 L1/L2 层级不一致可能阻止邻接形成。接下来检查 R02 的真实报文字段是否符合这一条件。</div>`);
}
function renderAnalysis(){
 const rows=PHASES.map(p=>({p,packets:packetSet(p,'000000000002')}));
 return `<article class="card network-card"><div class="card-head"><div><div class="section-label">EVIDENCE / 字段与规则</div><h2>R02 的 Hello 类型发生变化</h2></div>${phaseButtons()}</div><div class="card-body">${network()}<div class="table-wrap"><table><thead><tr><th>抓包窗口</th><th>R01 Hello</th><th>R02 Hello</th><th>R02 报文数</th></tr></thead><tbody>${rows.map(({p,packets})=>`<tr style="${p===phase?'background:#f3f7ff':''}"><td>${phaseNames[p]}</td><td>${esc(types(packetSet(p,'000000000001')))}</td><td style="color:${p==='fault'?'#a56c2b':'#537b67'}">${esc(types(packets))}</td><td>${packets.length}</td></tr>`).join('')}</tbody></table></div><div class="layer-grid">${[['L1','物理层','无规则命中'],['L2','链路层','L2-R003 命中'],['L3','路由层','L3-R004 命中'],['L4','应用层','无规则命中']].map(([l,n,s])=>`<div class="layer ${['L2','L3'].includes(l)?'active':''}"><b>${l} · ${n}</b><p>历史分析检查结果</p><span class="status">${s}</span></div>`).join('')}</div><div class="summary-report"><div class="report-kind">展示解读 · 已注明勘误</div><h3>单个层级配置故障，跨层规则命中</h3><p>R02 从 L2 LAN IIH 变为 L1 LAN IIH，R01 保持 L2。L2-R003 与 L3-R004 都指向 circuit_type_mismatch。建议核对两端 isis circuit-type 配置，不将两次命中当成两个独立故障。</p></div><div class="callout warn">原报告把两条规则命中标为复合故障；本页已纠正展示解读，原件仍可查看。日志方向表述存在差异，完整说明见“单故障解读与勘误”。</div></div></article>`;
}
function renderTrace(){
 const rows=DATA.trace.steps.filter(s=>!['RUNNING'].includes(s.status));
 return card('记录的是分析执行，不是网络修复','TRACE / 历史执行记录',`${metrics([['追踪事件',DATA.trace.steps.length,'包含开始与完成状态'],['执行错误',DATA.trace.errors.length,'追踪记录中的 errors'],['历史运行时间','20:07:13','2026-10-13 · Asia/Shanghai']])}<div class="trace-items">${rows.map(s=>`<div class="trace-item ${s.status==='FAIL'?'failed':''}"><div class="trace-title"><span>${esc(s.action)}</span><small>${esc(s.status)} · ${esc(s.timestamp)}</small></div><p>${s.layer==='report'?'历史诊断报告已写入输出目录。':esc(s.detail)}</p><code>${esc(s.layer)} / 事件 ${s.seq}</code></div>`).join('')}</div><div class="summary-report"><div class="report-kind">回放完成 / 交付物可追溯</div><h3>每一步，都有可以打开的证据</h3><p>知识准备产物来自本次补跑，故障分析与追踪来自历史记录。展示中使用的角色对应、字段复核与勘误说明均已单独标记。</p><button class="button quiet" data-artifact="evidence/original-report.md" style="margin-top:10px">查看原始报告 →</button></div><div class="callout">时序展示依据历史追踪重排为完成步骤。原始 JSON 与原始时序图 HTML 源码均保留；追踪不是独立 skill 调用审计。</div>`);
}
const renderers=[renderOverview,renderMaterial,renderBuilder,renderValidator,renderBridge,renderAnalysis,renderTrace];
function renderDetail(){const s=STAGES[current];return `<article class="card detail-card"><div class="section-label">THIS SKILL / 当前技能</div><div style="margin-top:11px"><span class="skill-tag">${s.skill}</span></div><h2>${s.nav}的作用</h2><p>${s.role}</p><div class="detail-rule"></div><div class="io"><small><i></i>输入</small><p>${s.input}</p></div><div class="io"><small><i></i>输出</small><p>${s.output}</p></div><div class="handoff-next"><b>交接到下一步</b>${s.next}</div></article><article class="card evidence-card"><div class="evidence-head"><h3>本阶段证据</h3><span class="badge gray">${s.files.length} 份</span></div><div class="evidence-list">${s.files.map(([id,label])=>{const a=asset(id);return `<button class="evidence-button" data-artifact="${id}"><span class="file-icon">${a?.binary?'PCAP':a?.name.split('.').pop().toUpperCase().slice(0,4)||'FILE'}</span><span><b>${label}</b><small>${a?fmtBytes(a.size):'查看文件'}</small></span><span class="chev">›</span></button>`;}).join('')}</div></article><div class="provenance"><b>来源与展示范围 · ${s.kind}</b>${s.note}</div>`;}
function render(){
 const s=STAGES[current];
 $('stage-nav').innerHTML=STAGES.map((item,i)=>`<button class="nav-item ${i===current?'active':''} ${i<current?'visited':''}" data-stage="${i}" ${i===current?'aria-current="step"':''}><span class="nav-num">${String(i+1).padStart(2,'0')}</span><span><span class="nav-title">${item.nav}</span><span class="nav-skill">${item.skill}</span></span></button>`).join('');
 $('eyebrow').textContent=s.eyebrow;$('stage-title').textContent=s.title;$('stage-desc').textContent=s.desc;$('step-number').textContent=String(current+1).padStart(2,'0');$('progress-fill').style.width=((current+1)/7*100)+'%';
 $('main-pane').innerHTML=renderers[current]();$('detail-pane').innerHTML=renderDetail();
 $('prev').disabled=current===0;$('next').disabled=current===6;$('play').textContent=playing?'Ⅱ 暂停播放':'▷ 自动播放';
 $('play-status').textContent=playing?'自动回放中 · 仅切换已保存的证据':'手动回放 · 可点击左侧任一阶段';
}
function stop(){playing=false;clearTimeout(timer);timer=null;$('play').textContent='▷ 自动播放';$('play-status').textContent='手动回放 · 可点击左侧任一阶段';}
function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{if(current>=6){stop();toast('回放完成，可以继续查看证据。');return;}current++;render();schedule();},Number($('speed').value));}
function gotoStage(index){stop();current=Math.min(6,Math.max(0,index));render();}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,2500);}
function showModal(title,subtitle,html,tools=''){stop();lastFocus=document.activeElement;$('modal-title').textContent=title;$('modal-subtitle').textContent=subtitle;$('modal-body').innerHTML=html;$('modal-tools').innerHTML=tools;$('modal-backdrop').hidden=false;document.body.style.overflow='hidden';$('modal-close').focus();}
function closeModal(){$('modal-backdrop').hidden=true;document.body.style.overflow='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}
function showArtifact(id){const a=asset(id);if(!a){toast('这份证据未包含在演示包中。');return;}const body=a.binary?`<div class="help-section"><h3>原始抓包 · ${esc(a.name)}</h3><p>文件包含 ${DATA.packets.length} 个合成报文，未在本次演示中生成或修改。可下载后用抓包工具核对协议字段。</p></div><div class="table-wrap"><table><thead><tr><th>相对时间</th><th>节点 System ID</th><th>Hello 类型</th><th>窗口</th></tr></thead><tbody>${DATA.packets.filter(p=>p.source_id==='000000000002').slice(0,15).map(p=>`<tr><td>T+${p.relative_s}s</td><td class="code">${p.source_id}</td><td>${esc(p.pdu_type_name)}</td><td>${phaseNames[p.stage]}</td></tr>`).join('')}</tbody></table></div><p class="source-date">预览仅列出 R02 的前 15 条报文。完整解码见 packets.json。</p>`:`<pre class="artifact-text">${esc(a.content)}</pre>`;showModal(a.name,a.path+' · '+fmtBytes(a.size),body,`<small>${a.sha256?'SHA-256 · '+esc(a.sha256.slice(0,24))+'…':'演示包资料索引'}</small><button class="button primary" data-download="${id}">下载原始文件 ↓</button>`);}
function download(id){const a=asset(id);if(!a)return;let content=a.content;if(a.binary){const raw=atob(content);content=Uint8Array.from(raw,c=>c.charCodeAt(0));}const blob=new Blob([content],{type:a.binary?'application/octet-stream':'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=a.name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('已导出 '+a.name);}
function showFiles(){showModal('证据档案','本地文件已内嵌，离线打开同样可以查看和下载。',`<div class="asset-list">${DATA.assets.map(a=>`<button class="asset-row" data-artifact="${a.id}"><span><b>${esc(a.name)}</b><small>${esc(a.path)}</small></span><small>${fmtBytes(a.size)} ›</small></button>`).join('')}</div>`,`<small>${DATA.assets.length} 份文件 · 原件、补跑记录与展示解读分别保存</small>`);}
function showHelp(){showModal('建议用 8–10 分钟讲完一次协作','不运行项目后台，不调用模型，不修改原项目数据。',`<div class="help-section"><h3>先说明数据来自哪里</h3><p>这是结果回放：诊断和追踪来自 2026-10-13；知识准备和 CSV 查询于 ${supplementDate} 在本地补跑。抓包与日志是项目归档的同场景合成样例，不能证明现场网络行为。</p></div><div class="help-section"><h3>讲解顺序</h3><ol><li><b>任务编排（1 分钟）：</b>切换正常、异常和恢复样例，介绍 R02 的字段变化与七类技能分工。</li><li><b>素材提取、知识构建（2 分钟）：</b>对照原始规则与候选行，查看 82 → 87 节点和合并前快照。</li><li><b>质量校验（1 分钟）：</b>打开实际问题项，说明严重错误为 0，但来源缺失仍需复核。</li><li><b>知识桥接、分层诊断（3 分钟）：</b>从查询节点走到报文字段、跨层规则与排查建议。</li><li><b>流程追踪（1 分钟）：</b>回看执行步骤，打开原报告与勘误，说明结论边界。</li></ol></div><div class="help-section"><h3>现场操作</h3><p>左侧可直接跳转；底部支持逐步或自动播放。抓包窗口和校验结果可以筛选。键盘左右箭头切换阶段，空格播放或暂停，Esc 关闭弹窗。打开任何证据会暂停自动播放。</p></div><div class="help-section"><h3>需要主动说明的边界</h3><p>原报告把同一故障的两层命中误写成复合故障，本页解读已纠正，原件未改。恢复段只展示合成字段恢复。未使用模型推理、实时 GraphRAG 或持续学习；知识导入不等于诊断规则自动更新。</p></div>`,`<small>建议逐步讲解，自动播放适合简短浏览。</small><button class="button" data-artifact="evidence/interpretation.md">查看完整勘误说明</button>`);}
function togglePlay(){if(playing){stop();return;}if(current===6)current=0;playing=true;render();schedule();}
document.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.dataset.stage!==undefined){gotoStage(Number(target.dataset.stage));return;}if(target.dataset.phase){phase=target.dataset.phase;render();return;}if(target.dataset.filter){filter=target.dataset.filter;render();return;}if(target.dataset.artifact){showArtifact(target.dataset.artifact);return;}if(target.dataset.download){download(target.dataset.download);return;}});
$('prev').onclick=()=>gotoStage(current-1);$('next').onclick=()=>gotoStage(current+1);$('reset').onclick=()=>{phase='fault';filter='all';gotoStage(0);};$('play').onclick=togglePlay;$('speed').onchange=()=>schedule();$('all-files').onclick=showFiles;$('help').onclick=showHelp;$('modal-close').onclick=closeModal;
$('modal-backdrop').addEventListener('click',e=>{if(e.target===$('modal-backdrop'))closeModal();});
document.addEventListener('keydown',event=>{if(!$('modal-backdrop').hidden){if(event.key==='Escape')closeModal();if(event.key==='Tab'){const focusables=[...$('modal-backdrop').querySelectorAll('button,a,input,select,[tabindex="0"]')].filter(el=>!el.disabled);const first=focusables[0],last=focusables[focusables.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}return;}if(['SELECT','INPUT','TEXTAREA','BUTTON','A'].includes(document.activeElement?.tagName))return;if(event.key==='ArrowRight'){event.preventDefault();gotoStage(current+1);}if(event.key==='ArrowLeft'){event.preventDefault();gotoStage(current-1);}if(event.code==='Space'){event.preventDefault();togglePlay();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)stop();});
$('supplement-date').textContent=supplementDate;render();
</script>
</body>
</html>
